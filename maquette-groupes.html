<title>Lap Timeline Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: the lap timeline on the left is the working surface (groups, actions, proposals inside the groups). Centre: status strip, oval, decision log. */
:root{color-scheme:dark;
  --bg:#121416;--panel:#1b1e21;--deep:#0f1113;--line:#2d3237;--line2:#3a4046;
  --fg:#ECEAE4;--muted:#9a9890;--dim:#5f5c55;
  --acc:#4F8CFF;--acc-soft:#1b2a4a;--good:#2ED47A;--warn:#F2A33A;--crit:#FF5C5C;--wood:#9a7140;
  --sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.3 var(--sans);overflow:hidden}
.app{height:100%;box-sizing:border-box;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:8px;height:36px;background:var(--deep);border:1px solid var(--line);border-radius:4px;padding:0 10px;flex:0 0 auto}
.bar h1{font:600 15px var(--sans);margin:0;white-space:nowrap}
.bar .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1 1 auto}
.btn{font:500 13px var(--sans);color:var(--fg);background:#23272b;border:1px solid var(--line2);border-radius:4px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:600}
.btn.quiet{color:var(--muted)}
.btn.danger{border-color:#6b2a2a;color:#ffb3b3}
.btn.xs{padding:2px 7px;font-size:12px;border-radius:3px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.seg .btn.on{background:var(--acc);color:#0b1020;font-weight:600}
.lbl{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;border-radius:4px;padding:0 5px;font:600 13px var(--mono);color:#fff;text-shadow:0 0 2px rgba(0,0,0,.7);box-sizing:border-box}
.chip.dk{color:#111;text-shadow:none}
.chip.silent{border:1px dashed var(--warn)}
.chip.off{border:1px dashed var(--crit);opacity:.75}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font:600 11px var(--sans);border:1px solid var(--line2);color:var(--fg);white-space:nowrap}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.crit{border-color:var(--crit);color:var(--crit)}
.pill.good{border-color:var(--good);color:var(--good)}
.ghost{display:inline-block;border:1px dashed var(--warn);color:var(--warn);border-radius:4px;padding:2px 7px;font:600 11px var(--mono);margin:4px 0 0 4px;vertical-align:middle}
.cw{position:relative;display:inline-block;margin:4px 7px 0 0;vertical-align:middle}
.cn{position:absolute;top:-7px;right:-8px;min-width:14px;height:14px;border-radius:7px;background:#ECEAE4;color:#111;font:600 9px var(--mono);display:flex;align-items:center;justify-content:center;padding:0 3px;border:1px solid #121416;box-sizing:border-box}
.lrow.sprint{border-left-color:#8FB4FF;background:#1a2238}
.lrow .k b{color:#8FB4FF;font-size:10px;letter-spacing:.04em}
.pill.acc{border-color:var(--acc);color:#8FB4FF}
.main{flex:1 1 auto;min-height:0;display:flex;gap:10px}
/* strip */
.strip{display:flex;align-items:stretch;height:40px;background:var(--deep);border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:0 0 auto}
.fld{display:flex;align-items:center;gap:8px;padding:0 12px;border-right:1px solid var(--line);white-space:nowrap}
.fld:last-child{border-right:0;margin-left:auto}
.fld .k{font:600 11px var(--sans);letter-spacing:.08em;color:var(--muted)}
.fld .v{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.fld .v.sm{font-size:14px}
.fld .u{font:500 12px var(--mono);color:var(--muted)}
/* timeline */
.tl{width:360px;flex:0 0 360px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0}
.tl .hd{display:flex;align-items:baseline;gap:8px;padding:8px 10px 6px;border-bottom:1px solid var(--line)}
.tl .hd .lbl{color:var(--fg)}
.tl .hd .note{color:var(--muted);font-size:11px;margin-left:auto}
.tl .body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column}
.tgrp{border:1px solid var(--line2);border-radius:4px;background:#17191c;padding:3px 4px 4px}
.tgrp.lead{border-color:var(--fg)}
.tgrp.pinned{border-color:var(--acc)}
.tgrp.incident{border-color:var(--crit);border-style:dashed}
.tgrp.over{background:var(--acc-soft)}
.gh{display:flex;align-items:center;gap:6px;height:24px;padding:0 4px;font:500 12px var(--sans);color:var(--muted);white-space:nowrap}
.gh .gi{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.gq{display:flex;align-items:center;gap:6px;height:24px;padding:0 4px;font:500 12px var(--sans);color:#c9d6f5;white-space:nowrap}
.gq span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.gh b{color:var(--fg);font-size:12px;letter-spacing:.04em;cursor:pointer}
.gh .gi{cursor:pointer}
.gh b:hover,.gh .gi:hover{color:#8FB4FF}
.gh b.crit{color:var(--crit)}
.gh .r{margin-left:auto;display:flex;gap:4px;flex:0 0 auto}
.gact{display:flex;flex-wrap:wrap;gap:4px;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
.prop{margin:2px 2px 3px;padding:3px 6px;border-left:3px solid var(--acc);background:#1a2238;border-radius:3px;font-size:12px;display:flex;align-items:center;gap:6px;min-height:26px}
.prop .pt{color:#c9d6f5;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop .pt b{color:var(--fg)}
.prop .pa,.gh .pa{display:inline-flex;gap:3px;flex:0 0 auto}
.gh .pa{margin-left:2px}
.gh span b{color:#8FB4FF}
.btn.ok{background:#143824;border-color:var(--good);color:var(--good);font-weight:700}
.trow .lap .btn.ok{padding:0 5px;height:18px;line-height:16px;margin-left:3px}
.trow{touch-action:none;display:grid;grid-template-columns:34px 24px 36px minmax(0,1fr) 0 62px;gap:6px;align-items:center;height:26px;padding:0 4px;border-radius:3px;cursor:grab;user-select:none}
.trow{position:relative}
.trow:hover{background:#20242a}
.trow .ra{display:none;position:absolute;left:108px;right:66px;top:2px;gap:2px;background:#20242a;justify-content:flex-end}
.trow:hover .ra{display:flex}
.trow.sel{background:var(--acc-soft);box-shadow:inset 2px 0 0 var(--acc)}
.trow.hl{background:#262b33}
.trow.dragging{opacity:.4}
.dragghost{position:fixed;z-index:50;pointer-events:none;background:var(--acc);color:#0b1020;font:600 12px var(--sans);padding:3px 9px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.trow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .noc{font:600 13px var(--mono);letter-spacing:.04em;color:var(--fg)}
.trow .flag{width:22px;height:15px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.trow .nm small{font-size:11px;margin-left:4px;color:var(--warn)}
.trow .nm small.crit{color:var(--crit)}
.trow .lap{font:600 12px var(--mono);text-align:right;white-space:nowrap}
.trow .lap{cursor:pointer}
.trow .lap .up{color:var(--good)}.trow .lap .down{color:var(--warn);margin-left:3px}.trow .lap .pend{color:#8FB4FF;margin-left:3px}
.ledger .ctr{display:inline-flex;align-items:center;gap:4px}
.ledger .ctr .k{font:600 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.ledger .ctr b{min-width:14px;text-align:center;font:600 13px var(--mono)}
.ledger .ctr b.up{color:var(--good)}.ledger .ctr b.down{color:var(--warn)}
.ledger .pal{display:inline-flex;gap:3px;align-items:center;margin-left:6px}
.ledger .sw{width:16px;height:16px;border-radius:3px;border:2px solid transparent;padding:0;cursor:pointer}
.ledger .sw.on{border-color:var(--fg)}
.ledger input[type=color]{width:22px;height:20px;padding:0;border:1px solid var(--line2);border-radius:3px;background:none;margin-left:4px;cursor:pointer}
.ledger{margin:2px 4px 6px 38px;border:1px solid var(--line2);border-radius:4px;background:#141618;padding:4px 6px;font-size:12px}
.ledger .lh{display:flex;align-items:center;gap:8px;height:24px;color:var(--muted)}
.ledger .lh b{color:var(--fg)}
.ledger .lh .r{margin-left:auto;display:flex;gap:3px}
.ledger .ll{display:grid;grid-template-columns:52px 50px minmax(0,1fr) auto;gap:8px;align-items:center;height:24px;border-top:1px solid var(--line)}
.ledger .ll .who{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger .ll.off span{text-decoration:line-through;color:var(--dim)}
.tgrp.pending{border-color:var(--acc)}
.trow .g{font:500 12px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tgap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;color:var(--muted);font:500 12px var(--mono);padding:0 6px;min-height:22px;border-radius:3px}
.tgap::before,.tgap::after{content:"";height:1px;background:var(--line2)}
.tgap.over{background:var(--acc-soft);color:var(--fg)}
.tgap .nz{display:none;font:600 12px var(--sans);color:var(--acc)}
.tgap{min-height:30px;margin:2px 0;border:1px dashed transparent}
body.dragging .tgap{border-color:var(--acc);background:#161c2a}
body.dragging .tgap .nz{display:inline}
body.dragging .tgap.last{flex:1 1 auto;min-height:70px}
.tier{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 4px 3px}
.tier:first-child{padding-top:2px}
.wd{border:1px solid var(--line2);border-radius:4px;background:#141618;padding:3px 4px 4px;margin-top:6px;opacity:.85}
.wd .trow{cursor:default;grid-template-columns:34px 24px 36px minmax(0,1fr) 60px 62px}
.gh .gno{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:3px;background:var(--line);color:var(--fg);font:500 11px var(--mono)}
.gh .ggap{flex:0 0 auto;font:500 12px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.tbar{border-top:1px solid var(--line);padding:6px 10px 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted);box-sizing:border-box}
.tbar b{color:var(--fg)}
.tbar .selinfo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbar .grpb{grid-column:1 / -1;display:flex;gap:4px;align-items:center}
.tbar .sep{width:1px;height:18px;background:var(--line2);margin:0 4px}
/* centre */
.mid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:10px}
.oval{flex:1 1 auto;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.oval svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.log{height:300px;flex:0 0 300px;background:var(--deep);border:1px solid var(--line);border-radius:4px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;overflow:hidden;box-sizing:border-box}
.log .hd{display:flex;justify-content:space-between;align-items:center;height:18px}
.log .rows{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:1px}
.lrow{display:grid;grid-template-columns:62px 72px minmax(0,1fr);gap:10px;align-items:center;min-height:32px;line-height:1.15;padding:0 6px;font-size:13px;white-space:nowrap;background:#17191c;border-left:3px solid var(--line2)}
.lrow.op{border-left-color:var(--acc)}
.lrow.dec .m{display:flex;align-items:center;gap:8px}
.lrow.dec .m .mt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lrow.rev .mt{text-decoration:line-through;color:var(--dim)}
.lrow .t{font:500 12px var(--mono);color:var(--muted)}
.lrow .k{font:600 11px var(--sans);letter-spacing:.06em;color:var(--muted)}
.lrow .m{overflow:hidden;text-overflow:ellipsis}
@media (max-width:1000px){body{overflow:auto}.app{height:auto}.main{flex-wrap:wrap}.tl{flex-basis:100%;width:auto;height:auto}.tl .body{overflow:visible}.mid{flex-basis:100%;height:620px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* sprint mode: the oval shrinks to a band, the crossings/decisions panel hides, the sprint card takes the centre */
.fld.acc{background:var(--acc-soft)}
.fld.acc .v,.fld.acc .k{color:#c9d6f5}
.chip.notp{border:1px dashed #8FB4FF}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:no-preference){.blink{animation:blink 1s steps(2,start) infinite}}
#scard{display:none;flex:1 1 auto;min-height:0;background:var(--panel);border:1px solid var(--acc);border-radius:4px;flex-direction:column;overflow:hidden}
body.sprintmode .oval{display:none}
body.sprintmode .log{display:none}
body.sprintmode #scard{display:flex}
.sh{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-bottom:1px solid var(--line);flex:0 0 auto;white-space:nowrap}
.sh b{font:600 14px var(--sans);letter-spacing:.04em}
.sh .lapn{color:var(--muted);font:500 13px var(--mono)}
.sh .cnt{color:var(--muted);font:500 12px var(--mono);margin-left:6px}
.sh .sp{flex:1 1 auto}
.sh .btn.sentok{background:#143824;border-color:var(--good);color:var(--good);font-weight:600}
.sh .btn.send{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:600}
.sh .btn.on{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:600}
.sh input{font:600 13px var(--mono);color:var(--fg);background:var(--deep);border:1px solid var(--line2);border-radius:3px;padding:3px 8px;width:150px}
.sh input:focus{outline:2px solid var(--acc);outline-offset:1px}
.sh input.err{border-color:var(--crit);background:#2a1414}
.sbody{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,620px) 270px;gap:18px;padding:6px 10px 8px;overflow:auto}
.sleft,.sright{min-width:0;display:flex;flex-direction:column}
.shd{display:grid;grid-template-columns:30px 34px 40px minmax(0,1fr) 66px 28px 28px;gap:6px;align-items:center;height:20px;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.shd.sl{grid-template-columns:34px 40px minmax(0,1fr) 72px}
.shd .srt{cursor:pointer}
.shd .srt.on{color:#8FB4FF}
.srow{display:grid;grid-template-columns:30px 34px 40px minmax(0,1fr) 66px 28px 28px;gap:6px;align-items:center;height:28px;padding:0 4px;border-top:1px solid var(--line);font-size:13px;user-select:none;touch-action:none}
.srow .pl{font:600 13px var(--mono);color:var(--muted);cursor:pointer;white-space:nowrap}
.srow .pl.tgt{color:var(--acc)}
.srow .noc{font:600 13px var(--mono);letter-spacing:.04em}
.srow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .nm small{font-size:11px;margin-left:5px;color:var(--muted)}
.srow .gp{font:500 12px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow .ic{display:flex;align-items:center;justify-content:center}
.srow .ic .btn.xs{padding:0 5px;height:18px;line-height:16px}
.srow.sent{background:#143824}
.srow.cam{background:#3a1515}
.srow.cam .gp{color:#ffb3b3}
.srow.held{border-left:3px solid #8FB4FF;background:#161c2a}
.srow.held .gp{color:#8FB4FF}
.srow.empty .pl{color:var(--dim)}
.srow.empty .nm{color:var(--dim)}
.srow.over{box-shadow:inset 0 2px 0 var(--acc)}
.srow[data-bib]{cursor:grab}
.srow.dragging{opacity:.4}
.sdrop{height:10px;border-radius:3px}
.sdrop.over{box-shadow:inset 0 2px 0 var(--acc)}
.sne{display:flex;align-items:center;gap:8px;height:28px;border-top:1px solid var(--line);padding:0 4px;margin-top:2px}
.srow.ne{height:24px;font-size:12px;color:var(--muted)}
.srow.ne .nm{color:var(--muted)}
.srow.ne .why{grid-column:5 / 7;font:500 11px var(--sans);color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nts{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px;margin:2px 0 4px;background:#2a2410;border:1px solid var(--warn);border-radius:3px;font-size:12px}
.nts .nm{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nts .nm small{color:var(--warn);margin-left:6px}
.stgt{display:flex;align-items:center;gap:6px;height:32px;margin:0 0 4px;padding:0 4px;border:1px solid var(--acc);border-radius:4px;background:#161c2a}
.stgt .k{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#c9d6f5;white-space:nowrap}
.stgt b{font:600 18px var(--mono);color:var(--acc);margin:0 6px 0 2px;min-width:44px}
.stgt .btn.on{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:600}
.stgt input{font:600 14px var(--mono);color:var(--fg);background:var(--deep);border:1px solid var(--line2);border-radius:3px;padding:2px 6px;width:64px}
.slrows{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.slrow{display:grid;grid-template-columns:34px 40px minmax(0,1fr) 80px;gap:6px;align-items:center;flex:0 0 auto;height:26px;padding:0 4px;border-top:1px solid var(--line);font-size:13px;user-select:none;cursor:grab;touch-action:none}
.slrow .noc{font:600 13px var(--mono);letter-spacing:.04em}
.slrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slrow .st{font:500 11px var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.slrow.placed .chip{opacity:.4}
.slrow.placed .nm{color:var(--muted)}
.slrow.out{color:var(--dim)}
.slrow.out .nm{color:var(--dim)}
.slrow.out .st{color:var(--warn)}
.slrow:hover{background:#20242a}
/* sprints and standings tabs in the bottom panel */
.lrow.spr{cursor:pointer}
.lrow.spr:hover{background:#20242a}
.lrow.spr .m{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.lrow.spr .m .sepv{width:1px;height:18px;background:var(--line2);margin:0 2px}
.lrow.spr .m .st{margin-left:auto}
.strow{display:grid;grid-template-columns:28px 34px 44px minmax(0,1fr) 44px 44px 44px 52px 52px 50px minmax(0,1fr);gap:8px;align-items:center;min-height:26px;padding:0 6px;font:500 13px var(--mono);font-variant-numeric:tabular-nums;background:#17191c;border-left:3px solid var(--line2);white-space:nowrap}
.strow.sthd{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:none;border-left-color:transparent}
.strow .nm{font:500 13px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strow .up{color:var(--good)}.strow .down{color:var(--warn)}
.strow .tot{font-weight:600;color:var(--fg)}
.strow .stt{font:500 12px var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outrow{display:grid;grid-template-columns:62px 72px minmax(0,1fr);gap:10px;align-items:center;min-height:24px;padding:0 6px;font:500 12px var(--mono);color:var(--muted);background:#141618;border-left:3px solid var(--line2);white-space:nowrap;overflow:hidden}
.outrow .m{overflow:hidden;text-overflow:ellipsis}
.outrow .k{font:600 11px var(--sans);letter-spacing:.06em}
.log .hd .seg{flex:0 0 auto}
.log .hd .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 8px}
.log .hd .xb{display:inline-flex;gap:4px;flex:0 0 auto}
</style>

<div class="app">

    <span class="sub">Men's Points Race · 40 laps · sprint every 10 laps · 250 m · simulated · build 52</span>

    <span class="lbl">Race leader</span>
    <span class="seg" id="armseg" title="The next rider read at this point becomes the race leader"><button class="btn quiet" data-arm="0">Finish</button><button class="btn quiet" data-arm="238">Pursuit A</button><button class="btn quiet" data-arm="113">Pursuit B</button></span>

    <section class="mid">
      <div class="strip" id="strip"></div>

        <svg viewBox="0 0 980 590" role="img" aria-label="Track view" id="oval">
          <rect x="110" y="95" width="760" height="400" rx="200" fill="#15181b" stroke="#9a7140" stroke-width="40"/>
          <rect x="127" y="112" width="726" height="366" rx="183" fill="none" stroke="#3b7fae" stroke-width="4"/>
          <rect x="118" y="103" width="744" height="384" rx="192" fill="none" stroke="#e05555" stroke-width="1"/>
          <path id="trackpath" d="M585,495 H670 A200,200 0 0 0 670,95 H310 A200,200 0 0 0 310,495 H585" fill="none" stroke="none"/>
          <line x1="585" y1="473" x2="585" y2="517" stroke="#FF5C5C" stroke-width="3"/>
          <text x="585" y="462" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="600" fill="#FF5C5C">Finish</text>
          <line x1="487" y1="475" x2="487" y2="515" stroke="#ECEAE4" stroke-width="2"/>
          <text x="487" y="462" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="#ECEAE4">Pursuit A</text>
          <line x1="490" y1="75" x2="490" y2="115" stroke="#ECEAE4" stroke-width="2"/>
          <text x="490" y="136" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" fill="#ECEAE4">Pursuit B</text>

        <div class="hd"><span class="seg" id="logtabs"><button class="btn xs on" data-tab="cross">Crossings</button><button class="btn xs quiet" data-tab="dec">Decisions</button><button class="btn xs quiet" data-tab="sprints">Sprints</button><button class="btn xs quiet" data-tab="stand">Standings</button></span><span class="lbl" id="loghint" style="color:var(--dim)">finish-line order of every lap · leader first · newest lap first</span><span class="xb" id="xbtns"></span></div>

<script>
(() => {
const TRACK = 250, LAPS = 40, SPRINT_EVERY = 10, LOOPS = [0, 113, 238], GROUP_GAP_S = 1.0, BIKE_L = 1.65, NEUTRAL_LAPS = 5, MISSING_S = 22;
const LOOPNAME = { 0: 'Finish', 113: 'Pursuit B', 238: 'Pursuit A' };
const RIDERS = [
  [52,'ROSSI','ITA','#0284c7'],[12,'HUBER','SUI','#c8102e'],[7,'BRAND','NED','#f97316',1],[61,'NAVARRO','COL','#eab308',1],
  [18,'SANTOS','POR','#9f1239'],[3,'MOREAU','FRA','#1d4ed8'],[9,'KOVAC','SLO','#16a34a'],[1,'RIVERA','ESP','#d62828'],
  [67,'LEHMANN','GER','#4b5563'],[58,'PETROV','KAZ','#06b6d4',1],[70,'SILVA','BRA','#22c55e',1],[46,'DE WIT','BEL','#111827'],
  [23,'IVERSEN','DEN','#ef4444'],[11,'TANAKA','JPN','#ec4899'],[4,'WALSH','GBR','#1e3a8a'],[15,"O'NEILL",'IRL','#15803d']
];
// Scripted scenario, by race lap. Everything else is a steady bunch.
const SCRIPT = {
  4:  { fromLap: 4, delta: -1.0, follow: 12, followLaps: 3 },   // BIB 4 and 11 drop off the back of the bunch
  11: { fromLap: 4, delta: -1.0, follow: 12, followLaps: 3 },   // … and take BIB 12's wheel for three laps when he catches them
  12: { fromLap: 5, delta: +1.7 },                               // BIB 12 attacks, catches 4 and 11 from behind, then takes a lap on the bunch
};
const SILENT = {};                              // transponder stops answering from lap 14
const CRASH = { lap: 999, bibs: [], backLap: 999 };  // crash at Pursuit B, back on the track four laps later
const NOTP = [15];                              // riders without transponder from the start: carried with their group, placed by hand
const TIGHT = { lap: 20, bibs: [52, 7] };       // sprint 2: BIB 7 and 52 cross the line within 15 ms (photo flag)

const $ = s => document.querySelector(s);
const fmtT = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); };
const bibList = bibs => bibs.length === 1 ? 'BIB ' + bibs[0] : 'BIB ' + bibs.slice(0, -1).join(', ') + ' and ' + bibs[bibs.length - 1];
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const byBib = (a, b) => a - b;

let S; // simulation + operator state
function reset() {
  S = {
    t: 0, factor: 1, finished: false,
    riders: RIDERS.map(([bib, name, nat, color, dk], i) => ({
      bib, name, nat, color, dk: !!dk,
      dist: -40 + i * 2.2, offset: 16.5 - i * 2.2, lapTrue: 0, mode: 'bunch', spd: 13.9,
      rec: null, lastRel: 0, inBunchSince: null,
    })),
    lapStatus: {},          // net laps by BIB (gained − lost), derived from S.laps
    laps: {}, refiles: {},  // per rider: { gained, lost } counters, and the crossings re-filings behind each rise
    groups: [],             // operator groups [{id, bibs, type:'manual'|'crash'|'mech', lap, t, open}]
    sprintOut: new Set(),   // riders excluded from the next sprint — facts
    withdrawn: new Map(),   // bib → {code, lap} — facts
    selection: new Set(), ledger: null,
    leader: null,           // race leader as designated: {bib, how, lap} — null = taken from the track
    arm: null,              // armed loop: the next rider read there becomes the race leader
    cross: {},              // finish-line crossings by race lap, in order
    finishOpen: null, finishCrossed: null, holes: {}, markPending: {},   // holes: lap lines a lapped rider has no crossing in
    undo: [],
    sprints: {}, sprintOpen: null, outputs: [], liveMode: true,   // sprints: one record per sprint (see sp()); outputs: what left for TV, scoreboard, web
    noTp: new Map(),        // bib → host bib: a rider without transponder is carried with that rider's group
    passes: [],             // every finish-line crossing read, raw {bib, t, n}
    log: [], proposals: [], snoozed: {}, dismissed: {}, nextId: 1, loggedLap: 0,
  };
  for (const r of S.riders) { S.lapStatus[r.bib] = 0; S.laps[r.bib] = { gained: 0, lost: 0 }; }
  for (const b of NOTP) { const i = RIDERS.findIndex(x => x[0] === b); S.noTp.set(b, RIDERS[(i + 1) % RIDERS.length][0]); logEvent('READ', 'BIB ' + b + ' · no transponder · start list · carried with the group, placed by hand in the sprints', false); }
  logEvent('RACE', 'Start · 16 riders · lap counter linked', false);
  S.factor = 4; dirty = true;   // opens at the start, running at '4
  lastDetect = -1; lastTl = -1;   // the render clocks start again with the race, or a restart waits for the old race time to pass
}

// ---------- simulation (true world) ----------
// simulation truth: the race lap is counted in the bunch's lap (a rider who physically took a lap is back in it)
function raceLap() { const lead = Math.max(...S.riders.filter(r => r.mode !== 'out').map(r => r.dist - TRACK * r.lapTrue)); return Math.min(LAPS, Math.floor(lead / TRACK) + 1); }
function step(dt) {
  const lap = raceLap();
  const bunchRiders = S.riders.filter(r => r.mode === 'bunch' && r.lapTrue === 0);
  const ref = bunchRiders.reduce((a, r) => a + r.dist, 0) / bunchRiders.length;
  const base = 13.9 + 0.3 * Math.sin(S.t / 40);
  for (const r of S.riders) {
    if (r.mode === 'out') continue;
    if (CRASH.bibs.includes(r.bib) && !r.crashed && lap >= CRASH.lap && (r.dist % TRACK) > 100 && (r.dist % TRACK) < 118) { r.mode = 'off'; r.crashed = true; }
    if (r.mode === 'off') { if (lap >= CRASH.backLap) { r.mode = 'bunch'; r.lapTrue = 0; r.dist = ref + r.offset - 30; } else continue; }
    const sc = SCRIPT[r.bib];
    if (sc && r.mode === 'bunch' && r.lapTrue === 0 && lap >= sc.fromLap && !r.done) { r.mode = 'away'; }
    if (r.mode === 'away') {
      r.spd = base + sc.delta + 0.1 * Math.sin(S.t / 5 + r.bib);
      if (sc.follow) {   // a dropped rider takes the wheel of the attacker who laps him, for a few laps
        const f = S.riders.find(x => x.bib === sc.follow);
        if (!r.following && f.mode === 'away' && Math.abs((f.dist - r.dist) - TRACK) < 8) r.following = lap;
        if (r.following && lap < r.following + sc.followLaps) r.spd = f.spd;
      }
      const rel = r.dist - ref;
      if (sc.delta > 0 && rel >= TRACK - 20) { r.mode = 'bunch'; r.lapTrue = 1; r.done = true; }
      if (sc.delta < 0 && rel <= -TRACK + 20) { r.mode = 'bunch'; r.lapTrue = -1; r.done = true; }
    } else {
      let off = r.offset, ph = r.bib;
      if (TIGHT.bibs.includes(r.bib) && lap >= TIGHT.lap - 2 && lap <= TIGHT.lap) { off = S.riders.find(x => x.bib === TIGHT.bibs[0]).offset + 0.15 * TIGHT.bibs.indexOf(r.bib); ph = TIGHT.bibs[0]; }   // a tight sprint
      const target = ref + TRACK * r.lapTrue + off + 6 * Math.sin(S.t / 9 + ph);
      r.spd = base + Math.max(-1.6, Math.min(1.6, 0.12 * (target - r.dist)));
    }
    const before = r.dist; r.dist += r.spd * dt;
    if (S.noTp.has(r.bib)) continue;               // no transponder: the loops never see him
    for (const L of LOOPS) {                       // loop crossings → readings, the only thing the software measures
      const kb = Math.floor((before - L) / TRACK), ka = Math.floor((r.dist - L) / TRACK);
      if (ka > kb && r.dist >= 0) {
        if (SILENT[r.bib] && lap >= SILENT[r.bib]) continue;
        const d = ka * TRACK + L, rec = { d, t: S.t - (r.dist - d) / r.spd, loop: L };
        rec.spd = r.rec ? (d - r.rec.d) / (rec.t - r.rec.t) : r.spd;
        r.rec = rec;
        // crossings log: line N = lap N of the race as judged. A rider's crossing is filed on his own count brought back by
        // his credited laps, so a rider who took a lap rides, and is listed, with the bunch. n keeps his real crossing count.
        if (L === 0 && ka > 0) {
          // crossings view, re-filing method: a crossing is filed on the rider's own count brought back by his CREDITED laps,
          // so a rider credited with a lap is listed with the bunch. Nothing else conditions it.
          const k = ka - S.lapStatus[r.bib];
          // the finish, however, is judged on the lap the loops measure for the head of the race
          const imp = S.bunchRaw == null || !S.inBunch || !S.inBunch.has(r.bib) ? 0 : Math.round((d - S.bunchRaw) / TRACK);
          const kn = ka - imp;
          const entry = { bib: r.bib, t: rec.t, n: ka }, pm = S.markPending[r.bib];
          if (pm) { entry.mark = pm; if (pm < 0 && k !== ka) (S.holes[k - 1] = S.holes[k - 1] || []).push(r.bib); delete S.markPending[r.bib]; }
          (S.cross[k] = S.cross[k] || []).push(entry);
          S.passes.push({ bib: r.bib, t: rec.t, n: ka });
          // finish: the head of the race, counted in the bunch's lap, opens the finish on completing the distance;
          // every other rider still in the race then finishes at his next crossing, and the race is closed when all have crossed
          if (L === 0 && !S.finishOpen && kn >= LAPS) { S.finishOpen = rec.t; S.finishCrossed = new Set(); logEvent('RACE', 'Finish · Lap ' + LAPS + ' · BIB ' + r.bib + ' first across the line · waiting for every rider', false); }
          if (L === 0 && S.finishOpen && rec.t >= S.finishOpen) S.finishCrossed.add(r.bib);   // the finish line only
        }
        if (S.arm === L && r.mode !== 'out' && !inIncident(r.bib)) { S.arm = null; designateLeader(r.bib, 'next crossing at ' + LOOPNAME[L]); }
      }
    }
  }
  S.t += dt;
  if (lap > S.loggedLap) S.loggedLap = lap;
  if (S.finishOpen && !S.finished && S.riders.filter(r => r.mode !== 'out' && !inIncident(r.bib) && !S.noTp.has(r.bib)).every(r => S.finishCrossed.has(r.bib))) { S.finished = true; S.factor = 0; syncSeg(); logEvent('RACE', 'Finish complete · ' + S.finishCrossed.size + ' riders across the line', false); }
}

// ---------- what the software knows ----------
function inIncident(bib) { return S.groups.find(g => g.type !== 'manual' && g.bibs.includes(bib)); }
function measured() {
  const now = S.t, out = new Map();
  for (const r of S.riders) {
    if (S.withdrawn.has(r.bib)) continue;
    const g = inIncident(r.bib);
    if (!r.rec) { out.set(r.bib, { pos: r.dist, spd: r.spd, read: true }); continue; }
    const fresh = now - r.rec.t <= MISSING_S;
    if (g) { out.set(r.bib, { pos: r.rec.d, spd: 0, read: fresh && r.rec.t > g.t, off: true, since: r.rec.t, loop: r.rec.loop }); continue; }
    if (!fresh) { out.set(r.bib, { pos: null, spd: r.rec.spd, read: false, since: r.rec.t, loop: r.rec.loop }); continue; }
    out.set(r.bib, { pos: r.rec.d + r.rec.spd * (now - r.rec.t), spd: r.rec.spd, read: true });
  }
  for (const [bib, host] of S.noTp) {   // a rider without transponder rides where his host rides: just behind him
    if (S.withdrawn.has(bib) || inIncident(bib)) continue;
    let hm = out.get(host); if (!hm || !hm.read || hm.off || hm.pos == null) hm = [...out.values()].find(m => m.read && !m.off && m.pos != null);
    if (hm) out.set(bib, { pos: hm.pos - 1.5, spd: hm.spd, read: true, notp: true });
  }
  const live = [...out.values()].filter(m => m.read && !m.off);
  const leaderPos = Math.max(...live.map(m => m.pos));
  for (const r of S.riders) {
    const m = out.get(r.bib); if (!m || m.off) continue;
    if (m.read) r.lastRel = leaderPos - m.pos; else m.pos = leaderPos - r.lastRel;   // a missing rider is carried along where he was last read
  }
  return out;
}

// ---------- groups: measured clusters on the track, operator groups, incident groups ----------
function computeGroups(M) {
  // The timeline reads the live race from the leader down to the tail of the race, on a continuous distance counted by
  // the loops. A credited lap brings a rider back into the bunch's lap ONLY as far as the loops have measured that lap:
  // a lap gained or lost that the crossings do not show yet (or a counter set by hand) does not move him on the timeline.
  const live = S.riders.filter(r => M.has(r.bib) && !M.get(r.bib).off);
  const readable = live.filter(r => M.get(r.bib).read);
  const spds = readable.map(r => M.get(r.bib).spd).sort((a, b) => a - b), thr = GROUP_GAP_S * (spds[Math.floor(spds.length / 2)] || 14) + BIKE_L;
  // 1. physical clusters: riders close together ON THE TRACK, whatever their lap (what the loops measure)
  const rows = live.map(r => { const m = M.get(r.bib); return { r, m, track: ((m.pos % TRACK) + TRACK) % TRACK }; });
  const byTrack = [...rows].sort((a, b) => a.track - b.track);
  const clusters = []; let cur = null;
  for (const x of byTrack) {
    if (!cur || x.track - cur.last > thr) { cur = { rows: [], id: clusters.length }; clusters.push(cur); }
    cur.rows.push(x); cur.last = x.track; x.cluster = cur;
  }
  if (clusters.length > 1) {   // the track is a circle: join the last cluster to the first across the finish line
    const first = clusters[0], last = clusters[clusters.length - 1];
    if (TRACK - last.last + first.rows[0].track <= thr) { for (const x of last.rows) { x.cluster = first; first.rows.push(x); } clusters.pop(); }
  }
  const bunchCluster = clusters.reduce((a, c) => (!a || c.rows.length > a.rows.length ? c : a), null);
  const bunchRaw = median(bunchCluster.rows.filter(x => x.m.read).map(x => x.m.pos)); S.bunchRaw = bunchRaw;
  // where each rider is by position alone, in laps from the front rider (alone, or the first of the front group): a rider a lap down from him has been caught by the leader
  const reads = live.map(r => ({ r, m: M.get(r.bib) })).filter(x => x.m.read && x.m.pos != null);
  const headPos = reads.reduce((a, x) => Math.max(a, x.m.pos), -Infinity);
  S.headLap = {};
  // a lap down is about 250 m behind him: a bunch 130 m back is not one, so the rounding starts a quarter lap short of the lap
  for (const x of reads) S.headLap[x.r.bib] = Math.round((x.m.pos - headPos + TRACK / 4) / TRACK);
  S.posOf = {};
  for (const x of reads) S.posOf[x.r.bib] = x.m.pos;
  // 2. race distance of each rider: measured crossings, brought back by the credited laps the loops confirm
  const inBunchCluster = new Set(bunchCluster.rows.map(x => x.r.bib)); S.inBunch = inBunchCluster;
  const impliedOf = r => inBunchCluster.has(r.bib) ? Math.round((M.get(r.bib).pos - bunchRaw) / TRACK) : 0;
  // Race distance: measured crossings, brought back by the laps the operator has CREDITED, as far as the loops confirm them.
  // So a rider who has just taken (or lost) a lap keeps his own block, with the proposal, until the operator validates;
  // then he joins the bunch block. A lap credited by hand that the loops do not show does not move him.
  // la regle de l'operateur: des qu'il n'y a plus de cassure entre lui et le peloton, le coureur reprend le tour
  // du peloton dans la timeline, sans attendre la validation - celle-ci ne decide que des +/-20 points.
  const np = r => M.get(r.bib).pos - TRACK * impliedOf(r);
  let leaderR = null;
  if (S.leader) {
    leaderR = readable.find(r => r.bib === S.leader.bib) || null;
    if (!leaderR) { logEvent('LEADER', 'BIB ' + S.leader.bib + ' no longer readable · leader taken from the track again', false); S.leader = null; }
    else {
      // the leader is not frozen: a rider who passes him on the track takes the lead
      const L0 = np(leaderR);
      for (const r of readable) {
        if (r === leaderR) continue;
        const rel = np(r) - L0;
        if (r.prevRel != null && r.prevRel <= 0 && rel > 0 && rel - r.prevRel < 40) { designateLeader(r.bib, 'passed BIB ' + leaderR.bib + ' on the track'); leaderR = r; break; }
      }
      for (const r of readable) r.prevRel = np(r) - np(leaderR);
    }
  }
  if (!leaderR) leaderR = readable.reduce((a, r) => (!a || np(r) > np(a) ? r : a), null);
  const leaderBib = leaderR.bib, leader = M.get(leaderBib), leaderNp = np(leaderR);
  for (const x of rows) x.behind = leaderNp - np(x.r);
  rows.sort((a, b) => a.behind - b.behind);

  // 2. display blocks: a physical cluster whose members are a lap apart in the race is shown as several blocks,
  //    each at its own distance from the leader; the block then says who it rides with on the track.
  const opOf = new Map(); for (const g of S.groups) for (const b of g.bibs) opOf.set(b, g);
  const pendingOf = b => { const p = S.proposals.find(p => p.kind === 'lap' && p.bibs.includes(b) && !(S.snoozed[p.key] && S.t < S.snoozed[p.key])); return p ? p.delta : 0; };
  const groups = [];
  for (const c of clusters) {
    const free = c.rows.filter(x => !opOf.has(x.r.bib)).sort((a, b) => a.behind - b.behind);
    let g = null;
    for (const x of free) {
      x.pending = pendingOf(x.r.bib);
      if (!g || x.behind - g.rows[g.rows.length - 1].behind > TRACK / 2) { g = { rows: [], op: null, cluster: c }; groups.push(g); }
      g.rows.push(x);
    }
  }
  for (const g of S.groups) {
    const grows = g.type === 'manual' ? rows.filter(x => g.bibs.includes(x.r.bib))
      : g.bibs.filter(b => M.has(b)).map(b => ({ r: S.riders.find(r => r.bib === b), m: M.get(b), behind: null }));
    for (const x of grows) x.pending = pendingOf(x.r.bib);
    if (grows.length) groups.push({ rows: grows, op: g, cluster: grows[0].cluster || null });
  }
  for (const g of groups) {
    g.rows.sort((a, b) => (a.behind == null ? 0 : a.behind) - (b.behind == null ? 0 : b.behind));   // inside a block: race order
    g.bibs = g.rows.map(x => x.r.bib);
    g.head = Math.min(...g.rows.map(x => x.behind == null ? 1e9 : x.behind)); g.tail = Math.max(...g.rows.map(x => x.behind == null ? -1e9 : x.behind));
    g.incident = !!(g.op && g.op.type !== 'manual');
    g.pending = g.rows.some(x => x.pending);
  }
  groups.sort((a, b) => (a.incident - b.incident) || (a.head - b.head));   // from the leader down to the tail of the race
  const bunch = groups.filter(g => !g.incident && g.cluster === bunchCluster).reduce((a, g) => (!a || g.rows.length > a.rows.length ? g : a), null)
    || groups.filter(g => !g.incident).reduce((a, g) => (!a || g.rows.length > a.rows.length ? g : a), null);
  for (const g of groups) {   // who else rides in the same physical cluster?
    const others = groups.filter(o => o !== g && !o.incident && o.cluster === g.cluster);
    g.with = others.length ? others.map(o => o === bunch ? 'the bunch' : o.rows.length === 1 ? 'BIB ' + o.bibs[0] : 'BIB ' + o.bibs.join(', ')).join(' and ') : '';
  }
  // --- la règle d'inéligibilité, formulation par groupes (opérateur, 25 octobre 2026) ---
  const numbered = groups.filter(g => !g.incident);
  const pisteOf = b => { const m = M.get(b); return m && m.pos != null ? ((m.pos % TRACK) + TRACK) % TRACK : null; };
  const pisteLead = pisteOf(leaderBib);
  numbered.forEach((g, i) => {
    g.no = i + 1;
    for (const x of g.rows) { const p = pisteOf(x.r.bib);
      x.dS = (g.no === 1 || p == null || pisteLead == null) ? 0 : (((pisteLead - p) % TRACK) + TRACK) % TRACK; }
  });

  if (dl) { try { await dl.save({ filename: name, data: text }); } catch (e) { if (e && e.code !== 'declined') console.warn('download', e); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function exportSprints() { const out = []; for (let k = 1; k <= NSPRINTS; k++) { if (!spStarted(k)) continue; const s = sp(k), O = spOrder(k), pts = spPoints(k); out.push({ sprint: k, final: isFinal(k), lap: s.lap, order: O.seq.filter(e => !e.empty).map(e => ({ place: e.place, bib: e.bib, t: e.t, gap: e.gap, points: pts[e.bib] || 0, photo: !!e.photo, held: !!e.held, manual: !!e.manual, sent: e.sent })), notEligible: O.notEligible.map(e => ({ bib: e.bib, crossed: e.raw, why: e.why })), sentAt: s.sentAt, live: s.live }); } download('sprints.json', JSON.stringify({ race: "Men's Points Race", laps: LAPS, sprints: out, outputs: [...S.outputs].reverse() }, null, 1), 'application/json'); logEvent('EXPORT', 'Sprints exported · ' + out.length + ' sprints', true); }
function exportStandings() { const rows = standings(), head = 'rank,bib,name,noc,sprint_points,sprint_wins,laps_gained,laps_lost,lap_points,total,final_sprint_place,status'; download('standings.csv', [head, ...rows.map((x, i) => [x.wd ? '' : i + 1, x.r.bib, x.r.name, x.r.nat, x.spr, x.wins, x.gained, x.lost, x.lapPts, x.total, x.fin || '', x.status].join(','))].join('\n'), 'text/csv'); logEvent('EXPORT', 'Standings exported · ' + rows.length + ' riders', true); }
function exportJournal() { download('journal.json', JSON.stringify([...S.log].reverse().map(e => ({ t: e.t, kind: e.k, text: e.m.replace(/<[^>]+>/g, ''), operator: !!e.op, corrected: e.reversed })), null, 1), 'application/json'); logEvent('EXPORT', 'Journal exported · ' + S.log.length + ' lines', true); }
function renderSprintsTab() {
  let h = '';
  for (let k = NSPRINTS; k >= 1; k--) {
    if (!spStarted(k)) continue;
    const s = sp(k), O = spOrder(k), seq = O.seq, st = spSendState(k), fin = isFinal(k), top = seq.slice(0, fin ? seq.length : SEND_PLACES);
    const pill = s.live ? (st.cls === 'sentok' ? '<span class="pill good">live · sent</span>' : '<span class="pill acc">live</span>') : s.sentAt == null ? '<span class="pill warn">not sent</span>' : st.cls === 'send' ? '<span class="pill warn">correction pending</span>' : '<span class="pill good">sent · ' + fmtT(s.sentAt) + '</span>';
    h += `<div class="lrow spr${S.sprintOpen === k ? ' op' : ''}" data-spopen="${k}" title="Open this sprint"><span class="t">${O.read.length ? fmtT(O.read[0].t) : ''}</span><span class="k">${fin ? 'FINAL<br>SPRINT' : 'SPRINT ' + k}<br><span style="color:var(--dim)">LAP ${s.lap}</span></span><span class="m">${top.map((e, i) => (i === 4 ? '<span class="sepv"></span>' : '') + (e.empty ? '<span class="chip" style="background:none;border:1px dashed var(--line2)">·</span>' : chip(S.riders.find(r => r.bib === e.bib), e.held ? 'notp' : ''))).join('')}${top.some(e => e.photo) ? '<span class="pill crit">photo</span>' : ''}${O.notEligible.length ? '<span class="lbl" style="color:var(--dim)">not eligible ' + O.notEligible.map(e => e.bib).join(', ') + '</span>' : ''}<span class="st">${pill}</span></span></div>`;
  }
  if (!h) h = '<div class="lrow"><span class="t"></span><span class="k">SPRINTS</span><span class="m" style="color:var(--dim)">laps ' + Array.from({ length: NSPRINTS }, (_, i) => (i + 1) * SPRINT_EVERY).join(', ') + ' · the last one counts double · the card opens on the sprint lap</span></div>';
  if (S.outputs.length) h += '<div class="lrow"><span class="t"></span><span class="k">OUTPUTS</span><span class="m" style="color:var(--dim)">TV · scoreboard · web · newest first</span></div>' + S.outputs.slice(0, 12).map(o => `<div class="outrow"><span>${fmtT(o.t)}</span><span class="k">S${o.k} · L${o.lap}</span><span class="m">${o.kind} · ${o.text}</span></div>`).join('');
  return h;
}
function renderStandingsTab() {
  const rows = standings();
  let h = '<div class="strow sthd"><span>#</span><span>BIB</span><span></span><span>Rider</span><span>spr</span><span class="up">gain</span><span class="down">lost</span><span>laps</span><span>total</span><span>final</span><span>status</span></div>';
  let rank = 0;
  for (const x of rows) { if (!x.wd) rank++; h += `<div class="strow"><span style="color:var(--muted)">${x.wd ? '' : rank}</span>${chip(x.r)}<span class="noc" style="color:var(--muted)">${x.r.nat}</span><span class="nm">${x.r.name}</span><span>${x.spr}</span><span class="up">${x.gained || ''}</span><span class="down">${x.lost || ''}</span><span>${x.lapPts ? (x.lapPts > 0 ? '+' : '') + x.lapPts : ''}</span><span class="tot">${x.total}</span><span style="color:var(--muted)">${x.fin ? ordinal(x.fin) : ''}</span><span class="stt">${x.status}</span></div>`; }
  return h;
}
logrows.addEventListener('click', e => { const t = e.target.closest('[data-spopen]'); if (t) { spOpen(+t.dataset.spopen); render(); } });
$('#xbtns').addEventListener('click', e => { const b = e.target.closest('[data-export]'); if (!b) return; ({ sprints: exportSprints, standings: exportStandings, journal: exportJournal })[b.dataset.export](); dirty = true; render(); });

// ---------- a rider without transponder: carried with his group, placed by hand ----------
function nearestHost(bib) {
  const G = lastG; if (G) for (const g of G.groups) { if (g.bibs.includes(bib)) { const o = g.bibs.find(b => b !== bib && !S.noTp.has(b)); if (o) return o; } }
  return (S.riders.find(r => r.bib !== bib && !S.noTp.has(r.bib) && !S.withdrawn.has(r.bib)) || {}).bib;
}
function noTpToggle(bibs, reversal) {
  const all = bibs.every(b => S.noTp.has(b));
  for (const b of bibs) { if (all) S.noTp.delete(b); else S.noTp.set(b, nearestHost(b)); }
  dropProposals(p => p.kind === 'missing' && p.bibs.some(b => bibs.includes(b)));
  logEvent('READ', bibList(bibs) + (all ? ' · transponder back · read again from the loops' : ' · no transponder · carried with the group, placed by hand in the sprints') + (reversal ? ' · reversal' : ' · operator'), true, reversal ? null : () => noTpToggle(bibs, true));
}
function rehost(bibs, allBibs) { for (const b of bibs) if (S.noTp.has(b)) { const o = allBibs.find(x => x !== b && !S.noTp.has(x)); if (o) S.noTp.set(b, o); } }

// ---------- loop ----------
window.__proto = { state: () => S, step, measured, computeGroups, render, detect, sp, spOrder, spFull, spSend, spInsert, spHold, standings, dispLap, noTpToggle, markDirty: () => { dirty = true; } };
reset(); render();
let last = performance.now();
// the race advances in fixed steps of FIXED seconds whatever the speed, so 1x, 4x and 16x run the same race;
// lap detection looks at every step (at 16x a frame is 0.8 s of race time, longer than the 0.3 s touch window)
const FIXED = 0.05;
let carry = 0;
function advance(dt) {
  if (S.factor <= 0 || S.finished) { carry = 0; return; }
  carry += dt * S.factor;
  while (carry >= FIXED && !S.finished) { step(FIXED); detectNow(); carry -= FIXED; }
}
function detectNow() { const M = measured(); detect(computeGroups(M), M); lastDetect = S.t; }
function frame() {
  const now = performance.now(), dt = Math.min(0.25, (now - last) / 1000); last = now;
  try { advance(dt); render(); } catch (e) { console.error(e); }
}
setInterval(frame, 50);   // a timer, not requestAnimationFrame: it keeps running when the page is in the background
})();
</script>
