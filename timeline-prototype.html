           ×1 by 12,3 px, ×16 under Replay by 16,6 px — and a symbol then sits off the middle of what the eye reads as

<script src="flags.js"></script>
<script>
(() => {
const GROUP_GAP_S = 1.0, BIKE_L = 1.65, CASS_DELAY_S = 0.3, NEUTRAL_LAPS = 5, MISSING_S = 22;
// Two wheels closer than this over the same tape switch make a single contact: the strip cannot tell them apart.
const TAPE_MIN_GAP = 0.05;
const round1 = x => Math.round(x * 10) / 10;
// Track, laps and sprints are set in the simulator and only before the start; everything below reads these.
// Geometry, as the operator stated it on 27 October 2026: NO distance is hard-coded. There is no rule for the
// distance between Finish and Pursuit A — the track owner decides, most often 10 m. What is compulsory is that the
// two pursuit loops are exactly face to face, each in the middle of its own straight, therefore exactly half a lap
// apart: 125 m on a 250 m track, 100 m on a 200, 83 m on a 166, 166,5 m on a 333. So `gap` is the only free
// setting, and Pursuit A, Pursuit B and the tape switches are all derived from it and from the lap length.
const DEF = { track: 250, laps: 40, sprints: 4, gap: 10, pace: 15 };
let CFG = { ...DEF };
let TRACK, LAPS, NSPRINTS, LOOPS, LOOPNAME, TAPES;
// The tape switches as installed: one in the middle of each of the three loops, plus the start and the intermediate
// of the flying 200 m — 200 m and 100 m before the line, which on a 250 m track falls 50 m and 150 m after it.
// A 166 m track has only the three of the loops: the flying 200 m is not raced there.
function buildTapes() {
  const t = [{ pos: 0, name: 'on Finish', loop: 0 }, { pos: LOOPS[1], name: 'on Pursuit B', loop: 1 }, { pos: LOOPS[2], name: 'on Pursuit A', loop: 2 }];
  if (TRACK !== 166) for (const [back, name] of [[200, '200 m start'], [100, '100 m intermediate']]) {
    const pos = round1(((TRACK - back) % TRACK + TRACK) % TRACK);
    if (!t.some(x => Math.abs(x.pos - pos) < 0.05)) t.push({ pos, name, loop: null });   // on a 200 m track the flying 200 m starts on the line itself: one strip there, not two
  }
  return t.sort((a, b) => a.pos - b.pos);
}
function applyCfg() {
  TRACK = CFG.track; LAPS = CFG.laps; NSPRINTS = CFG.sprints;
  const a = round1(TRACK - CFG.gap), b = round1(((a - TRACK / 2) % TRACK + TRACK) % TRACK);
  CFG.a = a; CFG.b = b;                        // derived, but kept on CFG because the rest of the file reads them
  LOOPS = [0, b, a];                           // index 0 Finish, 1 Pursuit B, 2 Pursuit A — S.reads is indexed the same way
  LOOPNAME = { 0: 'Finish', [b]: 'Pursuit B', [a]: 'Pursuit A' };
  TAPES = buildTapes();
  if ($('#marks')) renderMarks();
}
// The sprints are spread over the race: with 40 laps and 4 sprints they fall on 10, 20, 30, 40.
const sprintLap = k => Math.round(k * LAPS / NSPRINTS);
const sprintNumOf = lap => { for (let k = 1; k <= NSPRINTS; k++) if (sprintLap(k) === lap) return k; return 0; };
const nextSprintNum = lap => { for (let k = 1; k <= NSPRINTS; k++) if (sprintLap(k) >= lap) return k; return NSPRINTS; };
const RIDERS = [
  [52,'ROSSI','ITA','#0284c7'],[12,'HUBER','SUI','#c8102e'],[7,'BRAND','NED','#f97316',1],[61,'NAVARRO','COL','#eab308',1],
  [18,'SANTOS','POR','#9f1239'],[3,'MOREAU','FRA','#1d4ed8'],[9,'KOVAC','SLO','#16a34a'],[1,'RIVERA','ESP','#d62828'],
  [67,'LEHMANN','GER','#4b5563'],[58,'PETROV','KAZ','#06b6d4',1],[70,'SILVA','BRA','#22c55e',1],[46,'DE WIT','BEL','#111827'],
  [23,'IVERSEN','DEN','#ef4444'],[11,'TANAKA','JPN','#ec4899'],[4,'WALSH','GBR','#1e3a8a'],[15,"O'NEILL",'IRL','#15803d']
];
// CE QUE L'OPÉRATEUR A RÉGLÉ LUI RESTE. Ses mots, 28 octobre 2026 : « Les paramètres du simulateur ne doivent pas se
// remettre sur des valeurs codées en dur à chaque nouvelle course. Si un utilisateur modifie des noms, des nations,
// des dossards, des distances de boucles dans TRACK, ou des changements dans TRANSPONDERS il faut qu'il les retrouve
// dans une prochaine course ». Trois choses sont donc gardées : la liste de départ, la piste (longueur du tour,
// distance Finish → Pursuit A, tours, sprints, allure) et l'appairage transpondeur ↔ dossard. Elles sont relues au
// démarrage, et les valeurs ci-dessus ne servent plus que la toute première fois.
const SKEY = 'tct.sim.setup';
let TPMAP = null, TPSPARE = null;       // dossard → numéro de transpondeur, et les transpondeurs libres
function saveSetup() {
  // L'appairage est tenu à jour EN MÉMOIRE en même temps que sur le disque : c'est lui que `reset()` relit, et une
  // course neuve ne recharge pas la page. Sans cela le 99 repartait sur son transpondeur d'origine au premier New.
  if (S && S.tp) {
    TPMAP = {}; for (const t of S.tp) if (t.bib != null) TPMAP[t.bib] = t.id;
    TPSPARE = S.tp.filter(t => t.bib == null).map(t => t.id);
  }
  try {
    localStorage.setItem(SKEY, JSON.stringify({
      cfg: { track: CFG.track, laps: CFG.laps, sprints: CFG.sprints, gap: CFG.gap, pace: CFG.pace },
      riders: RIDERS, tp: TPMAP ? Object.entries(TPMAP).map(([b, id]) => [+b, id]) : null, spare: TPSPARE
    }));
  } catch (e) { /* storage full or blocked: the settings hold for this session only */ }
}
function loadSetup() {
  let d; try { d = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { return; }
  if (!d) return;
  if (d.cfg) for (const k of ['track', 'laps', 'sprints', 'gap', 'pace']) if (typeof d.cfg[k] === 'number') CFG[k] = d.cfg[k];
  if (Array.isArray(d.riders) && d.riders.length >= 2) { RIDERS.length = 0; for (const r of d.riders) RIDERS.push(r); }
  if (Array.isArray(d.tp)) { TPMAP = {}; for (const [bib, id] of d.tp) TPMAP[bib] = id; }
  if (Array.isArray(d.spare)) TPSPARE = d.spare;
}
const SILENT = {};                              // transponder stops answering from lap 14
const CRASH = { lap: 999, bibs: [], backLap: 999 };  // crash at Pursuit B, back on the track four laps later
const NOTP = [];                                // riders without transponder from the start: carried with their group, placed by hand
const TIGHT = { lap: 20, bibs: [52, 7] };       // sprint 2: BIB 7 and 52 cross the line within 15 ms (photo flag)

const $ = s => document.querySelector(s);
const fmtT = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); };
const bibList = bibs => bibs.length === 1 ? 'BIB ' + bibs[0] : 'BIB ' + bibs.slice(0, -1).join(', ') + ' and ' + bibs[bibs.length - 1];
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const byBib = (a, b) => a - b;

let simCols = { bib: true, nat: true, name: true };   // the dossard is never hidden: a rider without his number is nobody
let S; // simulation + operator state
function reset() {
  S = {
    t: 0, factor: 1, finished: false,
    riders: RIDERS.map(([bib, name, nat, color, dk], i) => ({
      bib, name, nat, color, dk: !!dk,
      dist: -40 + i * 2.2, offset: 16.5 - i * 2.2, lapTrue: 0, mode: 'bunch', spd: CFG.pace,
      rec: null, lastRel: 0, inBunchSince: null, inBunchPrev: false,   // inBunchPrev: was he in the bunch's cluster on the previous frame? the lap event is the frame that goes false → true
    })),
    lapStatus: {},          // net laps by BIB (gained − lost), derived from S.laps
    laps: {}, refiles: {},  // per rider: { gained, lost } counters, and the crossings re-filings behind each rise
    groups: [],             // operator groups [{id, bibs, type:'manual'|'crash'|'mech', lap, t, open}]
    sprintOut: new Set(),   // riders excluded from the next sprint — facts
    withdrawn: new Map(),   // bib → {code, lap} — facts
    selection: new Set(), ledger: null,
    leader: null,           // race leader as designated: {bib, how, lap} — null = taken from the track
    arm: null,              // armed loop: the next rider read there becomes the race leader
    cross: {},              // finish-line crossings by race lap, in order
    finishOpen: null, finishCrossed: null, holes: {}, markPending: {},   // holes: lap lines a lapped rider has no crossing in
    undo: [],
    sprints: {}, sprintOpen: null, outputs: [], liveMode: true,   // sprints: one record per sprint (see sp()); outputs: what left for TV, scoreboard, web
    noTp: new Map(),        // bib → host bib: a rider without transponder is carried with that rider's group
    passes: [],             // every finish-line crossing read, raw {bib, t, n}
    log: [], proposals: [], snoozed: {}, dismissed: {}, nextId: 1, loggedLap: 0,
    cass: {},               // per pair of riders following each other: the break as it stands confirmed
    inelig: new Set(),      // riders not eligible, from the groups rule in computeGroups
    started: false,         // the race waits for Start: nothing moves before the operator says so
    // The laps to go carry their own provenance (operator, 29 October 2026): the lap counter on the track, the
    // application counting by itself, or the operator counting by hand. And they can be held back from the outputs.
    // Two separate things, and they were one variable until they contradicted each other: WHICH provenance feeds
    // the laps to go, and HOW the application counts. Picking the lap counter must not wipe the operator's own count.
    togoPick: 'app',        // 'app' | 'counter' — the provenance the TO GO box shows
    togoMode: 'auto',       // 'auto' | 'manual' — how the application itself counts
    togoManual: null,       // the operator's own count, kept whichever provenance is picked
    togoExport: true,       // false: the number goes out on no output at all
    startState: 'idle',     // 'idle' | 'armed' | 'run' — what the start button says
    fsConfirm: false,       // a false start asks twice
    armDone: null,          // {i, bib, until}: the loop that has just named a leader shows his number for a moment
    pilot: {},              // bib → the simulator order the rider is riding: {kind:'spd'|'up'|'down'|'gain'|'lose'}
    taps: TAPES.map(() => []),       // what a tape switch emits: an instant, no identity at all — the software may read this
    tapeTruth: TAPES.map(() => []),  // the simulated truth behind those contacts {t, bib, merged}: forbidden to the software, like r.dist
    reads: LOOPS.map(() => []),      // every loop reading {bib, t}, per loop: the identified count the tape count is compared with
    tapePass: [],                    // one record per group passage judged at a loop (see tapeCount)
    tapeCut: TAPES.map(() => 0),     // first contact not yet judged, per tape switch
    tapeGroup: {},                   // per group: its recent count differences and the number of riders stated without a transponder
    noTpRec: {},                     // bib → {d, t, spd}: a rider without transponder fixed by a tape contact the operator attributed to him
    tp: [],                 // simulated transponders [{id, bib, silent, forBib}] — forBib: unknown to the software, worn by that rider
    // The reference scenario belongs to the reference race, and to nothing else. It used to run on every fresh
    // start, so BIB 12 attacked and BIB 4 and 11 were dropped while the operator was driving his OWN riders — three
    // speeds moving for a reason he had not asked for. It is loaded with the race, from Files.
    replay: null,           // a saved race being replayed: the piloting acts left to apply, by race time
  };
  for (const r of S.riders) { S.lapStatus[r.bib] = 0; S.laps[r.bib] = { gained: 0, lost: 0 }; }
  // L'appairage que l'opérateur a posé lui revient ; un coureur qu'il vient d'ajouter prend le premier numéro libre.
  S.tp = RIDERS.filter(([b]) => !NOTP.includes(b)).map(([b], i) => ({ id: (TPMAP && TPMAP[b]) || (1042 + i), bib: b, silent: false, forBib: null }));
  for (const id of (TPSPARE && TPSPARE.length ? TPSPARE : [2001, 2002, 2003])) S.tp.push({ id, bib: null, silent: false, forBib: null });
  // Deux bicyclettes ne portent jamais le même numéro : si l'appairage gardé en amène un qui est déjà pris, celui-là
  // reçoit le premier numéro encore libre, et le tableau reste lisible.
  { const vus = new Set(); let libre = 1042;
    for (const t of S.tp) { if (!vus.has(t.id)) { vus.add(t.id); continue; }
      while (vus.has(libre)) libre++; t.id = libre; vus.add(libre); } }
  // Which transponder is actually bolted to which bike is the simulator's truth; S.tp says whose the software BELIEVES
  // it is. The two agree until something separates them — two transponders swapped in the pits, say. The loops then
  // announce the name the table gives, which is the whole reason the operator has to be able to say they are swapped.
  for (const r of S.riders) { const t = S.tp.find(x => x.bib === r.bib); r.tp = t ? t.id : null; }
  // Each rider's slot in the bunch IS where he starts, so nobody has to ride across the bunch to reach it at the

    // faut donc que leur vitesse s'ajuste sur celle de 12 ». So it is the other rider's speed that is copied, step

// ---------- simulation (true world) ----------

  for (const g of S.groups) {
    const grows = g.type === 'manual' ? rows.filter(x => g.bibs.includes(x.r.bib))
      : g.bibs.filter(b => M.has(b)).map(b => ({ r: S.riders.find(r => r.bib === b), m: M.get(b), behind: null }));
    for (const x of grows) x.pending = pendingOf(x.r.bib);
    if (grows.length) groups.push({ rows: grows, op: g, cluster: grows[0].cluster || null });
  }
  for (const g of groups) {
    g.rows.sort((a, b) => (a.behind == null ? 0 : a.behind) - (b.behind == null ? 0 : b.behind));   // inside a block: race order
    g.bibs = g.rows.map(x => x.r.bib);
    g.head = Math.min(...g.rows.map(x => x.behind == null ? 1e9 : x.behind)); g.tail = Math.max(...g.rows.map(x => x.behind == null ? -1e9 : x.behind));
    g.incident = !!(g.op && g.op.type !== 'manual');
    g.pending = g.rows.some(x => x.pending);
  }
  groups.sort((a, b) => (a.incident - b.incident) || (a.head - b.head));   // from the leader down to the tail of the race
  const bunch = groups.filter(g => !g.incident && g.cluster === bunchCluster).reduce((a, g) => (!a || g.rows.length > a.rows.length ? g : a), null)
    || groups.filter(g => !g.incident).reduce((a, g) => (!a || g.rows.length > a.rows.length ? g : a), null);
  for (const g of groups) {   // who else rides in the same physical cluster?
    const others = groups.filter(o => o !== g && !o.incident && o.cluster === g.cluster);
    g.with = others.length ? others.map(o => o === bunch ? 'the bunch' : o.rows.length === 1 ? 'BIB ' + o.bibs[0] : 'BIB ' + o.bibs.join(', ')).join(' and ') : '';
  }
  // --- not eligible, by groups (the operator rule of 25 October 2026) ---
  // Groups are numbered from 1, the front group, down the timeline. On the oval, the distance of a group to the
  // next sprint is measured back from the front group, which is therefore at 0 by construction: that is the rule
  // "always take the front group as the closest one". After group n, only the members of group n+1 can be
  // eligible: any member of a group further down who is closer to the line than they are is not eligible.
  const numbered = groups.filter(g => !g.incident);
  const pisteOf = b => { const m = M.get(b); return m && m.pos != null ? ((m.pos % TRACK) + TRACK) % TRACK : null; };
  const pisteLead = pisteOf(leaderBib);
  numbered.forEach((g, i) => {
    g.no = i + 1;
    for (const x of g.rows) { const p = pisteOf(x.r.bib);
      x.dS = (g.no === 1 || p == null || pisteLead == null) ? 0 : (((pisteLead - p) % TRACK) + TRACK) % TRACK; }
  });
  S.inelig = new Set();                                  // group 1 and group 2 are always eligible
  for (let i = 2; i < numbered.length; i++) {
    const ref = Math.min(...numbered[i - 1].rows.map(x => x.dS));
    for (const x of numbered[i].rows) if (x.dS < ref) S.inelig.add(x.r.bib);
  }
  return { groups, leaderBib, leader, bunch, bunchCluster };   // no single threshold any more: it is per pair
}

// ---------- tape switches: the count the loops cannot give ----------
// The operator rule, docs/cas-de-course.md §9: a tape switch counts the bikes that pass, without identifying them.
// The difference with the loop count, which identifies, gives the number of riders without a transponder in the
// group. A missing contact signals two wheels too close to be told apart. The timestamp of the contact gives the
// rider's place in his group (not used yet).
// Three of the tape switches are in the middle of a loop, so the two watch the same point on the same passage and
// the comparison needs no extrapolation at all. The other two have no loop in front of them: they count bikes and
// there is nothing to compare them with. A burst of contacts, cut from the next by GROUP_GAP_S, is one passage of
// one group — the same break the groups themselves are cut on. A rider whose transponder has gone silent is, at the
// loop, indistinguishable from a rider who has none: counting him here is right, not a miss.
const TAPE_MATCH_S = 0.2;   // tape and loop sit at the same point, so their two instants for one bike differ only by rounding
// Operator rule, 27 October 2026, mot pour mot : « on connait l'heure de passage des deux transpondeurs sur la boucle
// (chaque décodeur de boucle est synchronisé avec le système) et on connait l'heure de passage du troisième coureur qui
// est en retard. Si on définit une marge d'erreur de détection de temps de passage des transpondeurs de l'ordre de 20
// millisecondes, on peut savoir si un tape switch détecte deux roues plus tard que les autres (par "plus tard" je veux
// dire "plus que les 20 millisecondes") alors on saura que ce n'est pas un des deux vélos 4 et 11. »
const TAPE_SYNC_S = 0.02;   // the margin on one bike's passage time, loop decoder against tape switch
const TAPE_WINDOW = 6;      // passages kept per group to read the count off: two laps, since a group crosses three tape switches a lap
function tapeCount() {
  const lap = raceLap();
  for (let i = 0; i < TAPES.length; i++) {
    const T = TAPES[i];
    const own = S.taps[i];
    let c = S.tapeCut[i];
    while (c < own.length) {
      let e = c; while (e + 1 < own.length && own[e + 1].t - own[e].t <= GROUP_GAP_S) e++;
      if (S.t - own[e].t <= GROUP_GAP_S) break;   // the group is still crossing: this passage is judged on a later pass
      const t0 = own[c].t, t1 = own[e].t, n = e - c + 1;
      if (T.loop == null) { c = e + 1; continue; }   // no loop here: nothing to compare the count with, nobody to name
      // Each contact looks for a transponder read at the same instant, to the 20 ms above. One reading answers for one
      // contact at most: two wheels too close make ONE contact for two readings, and the reading left over is the wheel
      // the strip could not tell apart — not a bike more. A contact that finds no reading of its own IS a bike without
      // a transponder, whatever the counts say.
      const win = S.reads[T.loop].filter(x => x.t >= t0 - TAPE_MATCH_S && x.t <= t1 + TAPE_MATCH_S);
      const read = [...new Set(win.map(x => x.bib))].sort(byBib);
      // Both lists are passages of the same bikes in the same order, so they are read together like two sorted
      // lists: a contact answers to the first reading still in hand that is within the margin. Matching the NEAREST
      // one instead would let a contact steal the reading of the bike behind it and invent a bike without a
      // transponder out of two riders 30 cm apart.
      const winS = win.slice().sort((a, b) => a.t - b.t);
      let j = 0, lone = 0, named = 0;
      for (let k = c; k <= e; k++) {
        const ct = own[k].t;
        while (j < winS.length && winS[j].t < ct - TAPE_SYNC_S) j++;   // that bike made no contact of its own
        if (j < winS.length && winS[j].t <= ct + TAPE_SYNC_S) { j++; named++; } else lone++;
      }
      const short = winS.length - named;   // transponders read that no contact of their own answered for
      S.tapePass.push({ tape: i, loop: T.loop, lap, t0, t1, n, read, lone, short });
      // Bikes where no transponder answered at all: they ride outside any group, so there is no group to place them
      // in. Only such a passage carries a rider the operator has attributed to a bike riding alone: a passage where a
      // transponder did answer may be his group's, and whether he rides in that group is the operator's to say.
      if (!read.length) { const carried = tapeTrack(T, t0, n); if (n > carried) tapeLone(T, t0, n - carried); c = e + 1; continue; }
      // How many riders of the group have no transponder. One passage is one measurement of it, and a measurement
      // that can only ever be too LOW: two wheels too close hide a bike, nothing invents one. So the number is the
      // highest the group's recent passages have shown — it rises on the first passage that sees the bike, and only
      // falls once TAPE_WINDOW passages in a row have stopped seeing it. The group is named by its lowest bib read,
      // which holds while riders join and leave it; the whole read list would flicker.
      const key = read.length ? Math.min(...read) : 'none';
      const g = S.tapeGroup[key] || (S.tapeGroup[key] = { key, read: [], recent: [], members: [], tape: '', diffs: [], stated: 0, short: 0 });
      g.read = read; g.tape = T.name;
      // who belongs to this group is taken over its last three passages, about a lap: a rider the loops happen to
      // miss on ONE passage must not look as though he had left it
      g.recent.push(read); if (g.recent.length > 3) g.recent.shift();
      g.members = [...new Set(g.recent.flat())].sort(byBib);
      g.diffs.push(lone); if (g.diffs.length > TAPE_WINDOW) g.diffs.shift();
      // Counted short is a state too, not an event: a group riding nose to tail is short on every passage it makes.
      if (short !== g.short) {
        if (short) logEvent('READ', T.name + ' · ' + plural(n, 'contact') + ' for ' + plural(read.length, 'rider') + ' read · ' + plural(short, 'contact') + ' missing: two wheels too close to be told apart', false);
        g.short = short;
      }
      const stated = Math.max(0, ...g.diffs);
      if (stated !== g.stated) {
        logEvent('READ', stated > 0
          ? plural(stated, 'bike') + ' without a transponder in the group of ' + plural(read.length, 'rider') + ' read · counted by the tape switch ' + T.name + (read.length && read.length <= 4 ? ' · with ' + bibList(read) : '')
          : 'as many bikes counted as transponders read in the group of ' + bibList(read.length <= 4 ? read : read.slice(0, 3)) + (read.length > 4 ? ' …' : '') + ' · no rider without a transponder left in it', false);
        g.stated = stated;
      }
      c = e + 1;
    }
    S.tapeCut[i] = c;
  }
  tapeAttribute();
}

// ---------- a rider without a transponder, riding alone ----------
// Operator, 27 October 2026 : « OUI évidemment qu'il faut se servir de cette info, à chaque fois qu'elle est utile !
// C'est-à-dire pendant la mise en place et pendant la course ! » Un contact de tape switch EST une position et un
// instant : une fois que l'opérateur a dit de qui il s'agit, il porte ce coureur exactement comme une lecture de
// boucle porte un coureur qui a un transpondeur. C'est ce qui permet à un coureur sans transpondeur d'être seul sur
// la piste, au lieu d'être toujours porté derrière quelqu'un d'autre.
const TAPE_MIN_SPD = 1, TAPE_MAX_SPD = 25;   // a bike that is moving at all, and no faster than a track sprinter
function tapeTrack(T, t, n) {
  let taken = 0;
  for (const b of Object.keys(S.noTpRec)) {
    const bib = +b;
    if (!S.noTp.has(bib) || S.withdrawn.has(bib) || inIncident(bib)) { delete S.noTpRec[bib]; continue; }
    if (taken >= n) break;
    const fx = S.noTpRec[bib], dt = t - fx.t;
    if (dt <= 0) continue;
    let adv = (((T.pos - fx.d) % TRACK) + TRACK) % TRACK;
    if (adv < 0.01) adv = TRACK;               // the same tape switch again means a whole lap later, not no distance at all
    const spd = adv / dt;
    if (spd >= TAPE_MIN_SPD && spd <= TAPE_MAX_SPD) { S.noTpRec[bib] = { d: fx.d + adv, t, spd }; taken++; }
  }
  return taken;
}
function tapeLone(T, t, n) {
  const loose = [...S.noTp.keys()].filter(b => !S.noTpRec[b] && !S.withdrawn.has(b) && !inIncident(b)).sort(byBib);
  if (!loose.length) return;
  addProposal({ key: 'alone:' + loose.join(','), kind: 'alone', bibs: loose, pos: T.pos, at: t, tape: T.name,
    text: '<b>' + plural(n, 'bike') + ' alone ' + T.name + '</b> · no transponder answered there · '
      + (loose.length === 1 ? 'BIB ' + loose[0] + ' has none' : bibList(loose) + ' have none'),
    actions: [
      ...loose.slice(0, 3).map(b => ({ label: 'It is BIB ' + b, primary: loose.length === 1, bib: b, run: p => tapeFix(b, p.pos, p.at, p.tape) })),
      { label: 'Dismiss', run: p => { const k = p.key; S.dismissed[k] = true; logEvent('OP', 'Bike alone at ' + p.tape + ' · dismissed', true, () => { delete S.dismissed[k]; logEvent('OP', 'Dismissal withdrawn · the proposal may come back · reversal', true); }); } },
    ] });
}
function tapeFix(bib, pos, t, tape, reversal) {
  const around = S.posOf[bib];
  let d = pos;   // the lap the contact belongs to is the one nearest where the software had him
  if (around != null) { let k = (((pos - around) % TRACK) + TRACK) % TRACK; if (k > TRACK / 2) k -= TRACK; d = around + k; }
  const was = S.noTpRec[bib];
  S.noTpRec[bib] = { d, t, spd: S.spdOf[bib] || 0 };
  dropProposals(p => (p.kind === 'tape' || p.kind === 'alone') && p.bibs.includes(bib));
  logEvent('READ', 'BIB ' + bib + ' · alone on the track · carried by the tape switch ' + tape + (reversal ? ' · reversal' : ' · operator'), true,
    reversal ? null : () => { if (was) S.noTpRec[bib] = was; else delete S.noTpRec[bib]; logEvent('READ', 'BIB ' + bib + ' · carried with his group again · reversal', true); });
  dirty = true;
}

// ---------- the extra bikes have names ----------
// Operator rule, 27 October 2026, mot pour mot : « quand le système détecte un vélo par les tape switchs de plus que
// les transpondeurs, que ce soit dans un groupe ou même en dehors d'un groupe, lors de cette détection des tape
// switch le système pourrait proposer le ou les coureurs dont on n'aurait pas les transpondeurs, et les placer dans
// le groupe détecté ou créer un nouveau groupe. Et ceci pourrait fonctionner presque tout au long de la course, et
// proposer si le système détecte qu'un coureur sans transpondeur ne fait plus partie d'un groupe il faudrait le
// proposer à l'utilisateur. »
// Le logiciel sait QUI n'a pas de transpondeur ; les tape switches disent COMBIEN de vélos un groupe a en trop.
// Rapprocher les deux reste une proposition : rien ne déplace un coureur tout seul.
function tapeAttribute() {
  const free = b => !S.withdrawn.has(b) && !inIncident(b);
  // a group counted once has no opinion yet: proposing on its first passage only produces a proposal that
  // the next passage withdraws
  const groups = Object.values(S.tapeGroup).filter(g => g.read.length && g.diffs.length >= 2);
  const placedIn = g => [...S.noTp].filter(([b, h]) => free(b) && g.members.includes(h)).map(([b]) => b).sort(byBib);
  // a group that counts a bike nobody has been placed in yet
  const spare = groups.filter(g => g.stated > placedIn(g).length);
  for (const [bib, host] of S.noTp) {
    if (!free(bib)) continue;
    // a rider the tape switches are carrying on his own is not looking for a group: he has a position of his own
    if (S.noTpRec[bib] && S.t - S.noTpRec[bib].t <= MISSING_S) { dropProposals(p => (p.kind === 'tape' || p.kind === 'alone') && p.bibs.includes(bib)); continue; }
    const his = groups.find(g => g.members.includes(host));
    // he is accounted for where he stands: the count confirms him, nothing to propose
    if (his && his.stated > placedIn(his).indexOf(bib)) { dropProposals(p => (p.kind === 'tape' || p.kind === 'alone') && p.bibs.includes(bib)); continue; }
    const target = spare.find(g => g !== his);
    // An open 'a bike passed alone' question already asks where he is, and answers it with a place: saying on top of
    // that that his group no longer counts him is the same question, twice, worse worded.
    const lone = S.proposals.some(q => q.kind === 'alone' && q.bibs.includes(bib));
    // only ever one open proposal per rider: knowing where he is replaces saying where he is not
    const want = target ? 'tape:' + bib + ':' + target.key : (his && !lone) ? 'tapeout:' + bib + ':' + his.key : null;
    dropProposals(p => p.kind === 'tape' && p.bibs.includes(bib) && p.key !== want);
    // naming the group he rides in answers the 'a bike passed alone' question: that bike was this one
    if (target) dropProposals(p => p.kind === 'alone' && p.bibs.includes(bib));
    if (!want) continue;
    if (target) addProposal({ key: want, kind: 'tape', bibs: [bib], read: [...target.read],
      text: '<b>BIB ' + bib + ' rides with ' + groupSay(target.read) + '</b> · the tape switch ' + target.tape + ' counts one bike more than the transponders read there · he has no transponder',
      actions: [
        { label: 'Place BIB ' + bib + ' there', primary: true, run: p => tapePlace(p.bibs[0], p.read) },
        { label: 'Not him', run: p => { const key = p.key; S.dismissed[key] = true; logEvent('OP', 'BIB ' + p.bibs[0] + ' is not the bike counted with ' + groupSay(p.read), true, () => { delete S.dismissed[key]; logEvent('OP', 'Dismissal withdrawn · the proposal may come back · reversal', true); }); } },
      ] });
    else addProposal({ key: want, kind: 'tape', bibs: [bib],
      text: '<b>BIB ' + bib + ' no longer with ' + groupSay(his.read) + '</b> · the tape switch ' + his.tape + ' counts as many bikes as transponders read there · he has no transponder and nothing says where he is',
      actions: [{ label: 'Keep him there', primary: true, run: p => { const key = p.key; S.dismissed[key] = true; logEvent('OP', 'BIB ' + p.bibs[0] + ' kept where he was · the tape switches do not count him there', true, () => { delete S.dismissed[key]; }); } }] });
  }
}
const groupSay = read => read.length <= 3 ? bibList(read) : 'BIB ' + read.slice(0, 3).join(', ') + ' and ' + (read.length - 3) + ' more';
function tapePlace(bib, read, reversal) {
  const was = S.noTp.get(bib), fx = S.noTpRec[bib];
  S.noTp.set(bib, read.find(b => !S.noTp.has(b)) || read[0]);
  delete S.noTpRec[bib];   // he is in a group again: the group carries him, not the lone contacts
  dropProposals(p => (p.kind === 'tape' || p.kind === 'alone') && p.bibs.includes(bib));
  logEvent('READ', 'BIB ' + bib + ' · placed with ' + groupSay(read) + ' · one bike more than transponders counted there' + (reversal ? ' · reversal' : ''), true,
    reversal ? null : () => { S.noTp.set(bib, was); if (fx) S.noTpRec[bib] = fx; logEvent('READ', 'BIB ' + bib + ' · placed back where he was · reversal', true); });
  dirty = true;
}

// ---------- proposals: inference, never applied by itself. Each shows inside the group it concerns. ----------
function addProposal(p) { if (S.proposals.some(q => q.key === p.key) || S.dismissed[p.key] || (S.snoozed[p.key] && S.t < S.snoozed[p.key])) return; p.id = S.nextId++; p.t = S.t; p.lap = raceLap(); S.proposals.push(p); dirty = true; }
function detect(G, M) {
  const now = S.t, lap = raceLap();
  tapeCount();
  // 1. laps gained / lost — §2, §3 and §4 of docs/rules-eligibility-merge.md, and nothing else.
  //    WHEN: the instant there is no cassure left between the rider and the bunch, "peu importe à quel endroit de
  //    la piste". That test is exactly what put him in the bunch's cluster (§3), so the event is: he was not in it
  //    on the frame before, he is now. No distance to the bunch is tested, and no tolerance is invented.
  //    HOW MANY LAPS: the crossings say it, counted against THE RIDER HE FACES (§4, "la mesure doit être entre…") —
  //    the bunch's last rider when he catches it from behind, the bunch's first rider when it catches him. Those two
  //    are the pair of consecutive riders at the border of the two groups, which is why the facing rider is simply
  //    his nearest neighbour in the cluster who was already in the bunch. Being side by side, the difference between
  //    their measured race distances is within a few metres of a whole number of laps — one lap more and he gained
  //    one, one lap fewer and he lost one, zero and he simply closed an ordinary gap.
  //    Both numbers are raw measurements: `m.pos` is the loops' own distance, never the folded display position.
  //    What the loops do not show is never proposed: a counter set by hand is the operator's business.
  if (G.bunch) {
    const inBunchNow = new Set(G.bunch.bibs);
    // taken before the loop below, which overwrites r.inBunchPrev as it goes
    const prevIn = new Set(S.riders.filter(r => r.inBunchPrev).map(r => r.bib));
    const seq = S.bunchSeq || [];                     // the bunch's cluster, rear -> front in travel order
    const facingPos = bib => {
      const i = seq.indexOf(bib);
      if (i >= 0) for (let d = 1; d < seq.length; d++) for (const j of [i - d, i + d]) {
        if (j < 0 || j >= seq.length || !prevIn.has(seq[j])) continue;
        const mm = M.get(seq[j]); if (mm && mm.read && mm.pos != null) return mm.pos;
      }
      return S.bunchRaw;                              // no neighbour of the bunch read: fall back to its front rider
    };
    const cands = [];
    for (const r of S.riders) {
      if (r.mode === 'out') continue;
      const inNow = inBunchNow.has(r.bib), m = M.get(r.bib);
      const face = inNow && !r.inBunchPrev && m && m.read ? facingPos(r.bib) : null;
      if (face != null) {
        const delta = Math.round((m.pos - face) / TRACK);
        const open = S.proposals.some(p => p.kind === 'lap' && p.bibs.includes(r.bib));
        if (delta && !open) cands.push({ bib: r.bib, delta });
      }
      r.inBunchPrev = inNow;
    }
    const byDelta = {}; for (const c of cands) (byDelta[c.delta] = byDelta[c.delta] || []).push(c.bib);
    for (const d in byDelta) {
      const bibs = byDelta[d].sort(byBib), delta = +d, gaining = delta > 0;
      addProposal({ key: 'lap:' + bibs.join(',') + ':' + delta, kind: 'lap', bibs, delta,
        text: '<b>' + bibList(bibs) + (gaining ? ' gaining a lap</b>' : ' losing a lap</b>') + ' · ' + (gaining ? 'caught the bunch from behind' : 'caught by the bunch') + ' at Lap ' + lap + ' · ' + (gaining ? 'one crossing more' : 'one crossing fewer') + ' than the bunch · validate per rider or all',
        actions: [
          ...bibs.map(b => ({ label: (gaining ? '+' : '−') + Math.abs(delta) + ' lap · BIB ' + b, primary: true, bib: b, run: p => applyLap([b], p.delta, 'validated proposal', p.t) })),
          ...(bibs.length > 1 ? [{ label: (gaining ? '+' : '−') + Math.abs(delta) + ' lap · all ' + bibs.length, primary: true, run: p => applyLap([...p.bibs], p.delta, 'validated proposal', p.t) }] : []),
          { label: 'Dismiss', run: p => { const key = p.key; S.dismissed[key] = true; logEvent('OP', 'Dismissed: ' + bibList(p.bibs) + (gaining ? ' gaining' : ' losing') + ' a lap', true, () => { delete S.dismissed[key]; logEvent('OP', 'Dismissal withdrawn · the proposal may come back · reversal', true); }); } },
        ] });
    }
  }
  // 2. riders not read for more than a lap, grouped when they went missing together: crash, mechanical, or a silent transponder
  for (const p of S.proposals.filter(p => p.kind === 'missing' && p.bibs.every(b => M.get(b) && M.get(b).read))) { dropProposals(q => q === p); logEvent('READ', bibList(p.bibs) + ' read again · back in the measured groups', false); }
  const missing = [];
  // a rider the operator has declared without a transponder is not 'not read': there is nothing to read. What is
  // open about him is where he is, which the tape switches answer (tapeAttribute), not whether his transponder works.
  for (const [bib, m] of M) if (!m.read && !m.off && !S.noTp.has(bib) && !S.proposals.some(p => p.kind === 'missing' && p.bibs.includes(bib))) missing.push({ bib, m });
  while (missing.length) {
    const a = missing.shift(), set = [a, ...missing.filter(b => Math.abs(b.m.since - a.m.since) < 4)];
    for (const b of set) { const i = missing.indexOf(b); if (i >= 0) missing.splice(i, 1); }
    const bibs = set.map(x => x.bib).sort(byBib), sinceLap = Math.max(1, Math.floor(S.riders.find(r => r.bib === a.bib).rec.d / TRACK) + 1);
    const key = 'missing:' + bibs.join(',') + ':' + Math.round(a.m.since);
    addProposal({ key, kind: 'missing', bibs, sinceLap, loop: LOOPNAME[a.m.loop],
      text: '<b>' + bibList(bibs) + ' not read</b> since ' + LOOPNAME[a.m.loop] + ', Lap ' + sinceLap + (bibs.length > 1 ? ' · together' : ''),
      actions: [
        { label: 'Crash', primary: bibs.length > 1, run: p => newGroup(p.bibs, 'crash', p.sinceLap) },
        { label: 'Mech.', run: p => newGroup(p.bibs, 'mech', p.sinceLap) },

  const i = RACES.findIndex(x => x.id === REC.id);
  const old = i >= 0 ? RACES[i] : null;
  const r = { id: REC.id, no: old ? old.no : raceNo(), cfg: REC.cfg, acts: REC.acts.map(a => ({ ...a })), laps: S.finished ? LAPS : dispLap(), dur: +S.t.toFixed(1), at: Date.now() };
  // Its name follows the orders given, so it stays true as the race goes on — unless the operator has renamed it
  // himself, and then it is his and nothing touches it again.
  if (old && old.named) { r.name = old.name; r.named = true; }
  else {
    r.name = raceName(r);
    let n = 2, name = r.name; while (RACES.some(x => x.id !== r.id && x.name === name)) name = r.name + ' (' + n++ + ')';
    r.name = name;
  }
  if (i >= 0) RACES[i] = r; else RACES.unshift(r);
  saveRaces(); railDirty = true;
}

// the group just ahead of a rider in the timeline, or just behind: read from the blocks the last render computed,
// never by calling computeGroups again (it has side effects — pitfall H11)
function neighbourGroup(bib, dir) {
  const gs = (lastG && lastG.groups || []).filter(g => !g.incident);
  const i = gs.findIndex(g => g.rows.some(x => x.r.bib === bib));
  const n = gs[i + dir];
  return i < 0 || !n ? null : n.rows.map(x => x.r.bib).filter(b => b !== bib);
}

function bikeChange(bib) {
  const t = tpOf(bib);
  const spare = S.tp.find(x => x !== t && x.bib === null && !x.forBib);   // the new bike carries another transponder, unknown to the software
  if (t) { t.bib = null; t.silent = false; }
  if (spare) spare.forBib = bib;
  const rr = S.riders.find(x => x.bib === bib); if (rr) rr.tp = spare ? spare.id : null;   // the truth: his new bike carries that one
  if (!S.noTp.has(bib)) { const o = S.riders.find(x => x.bib !== bib && !S.noTp.has(x.bib) && x.mode !== 'out'); S.noTp.set(bib, o ? o.bib : bib); }
  logEvent('READ', 'BIB ' + bib + ' · bike change · no transponder · carried with the group, placed by hand in the sprints', false);
}
// The mix-up itself. Operator, 27 October 2026 : « effectivement le système ne peut pas le savoir. Mais l'opérateur
// oui ! » — so this writes nothing in the journal and raises nothing. Each bike keeps rolling, the loops go on
// announcing a name for every passage, and the two names are each other's.
function swapBikes(a, b) {
  const ra = S.riders.find(x => x.bib === a), rb = S.riders.find(x => x.bib === b);
  if (!ra || !rb) return;
  const t = ra.tp; ra.tp = rb.tp; rb.tp = t;
}
// The correction, from the operator, who has seen it with his own eyes: « Il doit donc avoir un moyen d'indiquer
// cette inversion au système, qui à son tour l'inversera dans l'attribution des transpondeurs aux coureurs. »
// What was measured under one name was the other rider's bike, so the records change hands with the attribution.
function swapTp(a, b, reversal) {
  const ta = tpOf(a), tb = tpOf(b); if (!ta || !tb) return;
  ta.bib = b; tb.bib = a;
  const ra = S.riders.find(x => x.bib === a), rb = S.riders.find(x => x.bib === b);
  if (ra && rb) { const rc = ra.rec; ra.rec = rb.rec; rb.rec = rc; }
  logEvent('READ', 'BIB ' + a + ' and BIB ' + b + ' · transponders swapped · attribution exchanged' + (reversal ? ' · reversal' : ' · operator'), true,
    reversal ? null : () => swapTp(a, b, true));
  saveTpIfSetup();
  railDirty = true; dirty = true;
}
function assignTp(id, bib) {
  const t = S.tp.find(x => x.id === id); if (!t) return;
  const target = bib || t.forBib || [...S.noTp.keys()][0]; if (!target) return;
  const old = tpOf(target); if (old) { old.bib = null; old.forBib = null; }
  t.bib = target; t.forBib = null; t.silent = false;
  const rr = S.riders.find(x => x.bib === target); if (rr) rr.tp = t.id;
  S.noTp.delete(target);
  logEvent('READ', 'BIB ' + target + ' · transponder ' + t.id + ' · read again from the loops', false);
  saveTpIfSetup();
}
function freeTp(id) {
  const t = S.tp.find(x => x.id === id); if (!t || !t.bib) return;
  const bib = t.bib; t.bib = null; t.silent = false;
  const rr = S.riders.find(x => x.bib === bib); if (rr) rr.tp = null;   // the truth: nothing on his bike any more
  if (!S.noTp.has(bib)) { const o = S.riders.find(x => x.bib !== bib && !S.noTp.has(x.bib) && x.mode !== 'out'); S.noTp.set(bib, o ? o.bib : bib); }
  logEvent('READ', 'BIB ' + bib + ' · transponder ' + t.id + ' removed · no transponder · carried with the group', false);
  saveTpIfSetup();
}

// L'appairage transpondeur ↔ dossard touché AVANT le départ est un RÉGLAGE : il se garde pour les courses
// suivantes. Touché pendant une course, c'est un fait de cette course-là — un vélo changé, deux transpondeurs
// échangés dans les boxes — et il n'a aucune raison de suivre dans la course d'après.
function saveTpIfSetup() { if (!S.started) saveSetup(); }
// one place for every simulator order, so the buttons and a replayed race do exactly the same thing
function doAct(kind, bibs, v, record = true) {
  if (kind === 'swapbikes') { swapBikes(bibs[0], bibs[1]); if (record) recAct(kind, bibs, v); railDirty = true; dirty = true; return; }
  for (const bib of bibs) {
    const r = S.riders.find(x => x.bib === bib);
    if (kind === 'spd' && r) { S.pilot[bib] = { kind: 'spd', v }; r.mode = 'pilot'; }
    else if ((kind === 'gain' || kind === 'lose') && r) { S.pilot[bib] = v && v.wheel ? { kind, wheel: v.wheel, wheelLaps: v.wheelLaps } : { kind }; r.mode = 'pilot'; }
    else if ((kind === 'up' || kind === 'down') && r) { const m = neighbourGroup(bib, kind === 'up' ? -1 : 1); if (!m || !m.length) continue; S.pilot[bib] = { kind, bibs: m }; r.mode = 'pilot'; }
    else if (kind === 'free' && r) { delete S.pilot[bib]; r.mode = 'bunch'; r.done = true; }
    else if (kind === 'silent') { const t = tpOf(bib); if (t) t.silent = !t.silent; }
    else if (kind === 'bike') bikeChange(bib);
    else if (kind === 'assign') assignTp(v, bib);
    else if (kind === 'free-tp') freeTp(v);
  }
  if (record) recAct(kind, bibs, v);
  railDirty = true; dirty = true;
}
function replayTick() {
  if (!S.replay) return;
  while (S.replay.length && S.replay[0].t <= S.t) { const a = S.replay.shift(); doAct(a.kind, a.bibs, a.v, false); }
  if (!S.replay.length) S.replay = null;
}

function setTrack(len) {
  if (S.started) return;
  CFG.gap = Math.min(CFG.gap, Math.round(len / 4));   // the gap is the owner's distance in metres, not a proportion; the loops and the tape switches follow from it
  CFG.track = len; applyCfg(); reset(); REC = newRec(); saveSetup(); syncSeg(); railDirty = true; dirty = true; render();
}
// The pace is the bunch's own speed, and it is the one setting that means something DURING the race: the operator
// slows the race down or speeds it up while it runs. It therefore never resets anything. Laps, sprints, the track
// and the loop distances are the opposite: they define the race, so they are locked the moment it starts.
function setPace(v) {
  if (!isFinite(v)) return;
  CFG.pace = +Math.max(5, Math.min(25, v)).toFixed(1); saveSetup();
  for (const r of S.riders) if (!S.pilot[r.bib]) r.spd = CFG.pace;   // shown at once, before the start as well as during
  if (!S.started) REC = newRec();
  railDirty = true; dirty = true; render();
}
function cfgStep(key, d) {
  if (key === 'pace') return setPace(CFG.pace + d * 0.1);
  if (S.started) return;
  if (key === 'laps') { CFG.laps = Math.max(2, Math.min(400, CFG.laps + d)); CFG.sprints = Math.min(CFG.sprints, CFG.laps); }
  else if (key === 'sprints') CFG.sprints = Math.max(1, Math.min(CFG.laps, CFG.sprints + d));
  else if (key === 'gap') CFG.gap = Math.max(0, Math.min(Math.round(TRACK / 4), CFG.gap + d));
  applyCfg(); REC = newRec(); saveSetup(); railDirty = true; dirty = true; render();
}

// Hiding the simulator must not take the race controls away: the transport block is MOVED into the top bar, not
// copied, so there is only ever one play button and one clock in the page.
function railHide(h) {
  $('#rail').hidden = h; $('#railshow').hidden = !h;
  const t = $('#simtransport');
  if (h) $('.bar').appendChild(t); else $('#railtransport').appendChild(t);
  $('.bar').classList.toggle('withtransport', h);
}
function syncSub() {
  $('#subtitle').textContent = "Men's Points Race · " + plural(LAPS, 'lap') + ' · ' + plural(NSPRINTS, 'sprint') + ' · ' + TRACK + ' m · simulated · build 92';

// The simulator takes the width its open tab needs, and gives the rest back to the operator's screen. Only the
// Simulation tab varies: its identity columns are the operator's choice, so hiding one has to buy him room. The
// other four tabs keep the width they were drawn for.
const RAIL_FULL = 460, RAIL_MIN = 346;   // the floor is the tab strip and the Pace row, measured: narrower and they wrap
const ID_W = { bib: 32, nat: 34, name: 104 };
function railWidth() {
  if (simTab !== 'riders') return RAIL_FULL;
  const ids = Object.keys(ID_W).filter(k => simCols[k]);
  const n = ids.length + 5;   // the five that are always there: m/s, ↑, ↓, +lap, −lap
  return Math.min(RAIL_FULL, Math.max(RAIL_MIN, 230 + ids.reduce((a, k) => a + ID_W[k], 0) + 4 * (n - 1) + 38));
}

      + '<span style="text-align:center;color:var(--muted)">m/s</span>'

      <span class="spd"><button class="stp" data-sim="spd" data-bib="${r.bib}" data-d="-1">−</button><input class="v" data-bib="${r.bib}" value="${r.spd.toFixed(1)}" title="Type a pace, Enter to set · empty to put him back in the bunch"><button class="stp" data-sim="spd" data-bib="${r.bib}" data-d="1">+</button></span>
      <button class="btn xs quiet" data-sim="up" data-bib="${r.bib}" title="Join the group ahead">↑</button>

      <button class="btn xs quiet" data-sim="lose" data-bib="${r.bib}" title="Force to lose a lap">−lap</button></div>`).join('');
  for (const el of $('#simriderslist').querySelectorAll('.rrow[data-bib]')) {

    railRows[bib] = { el, v: el.querySelector('.v'), b };
  }

  const nameOf = b => { const r = S.riders.find(x => x.bib === b); return r ? r.name : ''; };
  const two = [...S.selection].sort(byBib);
  $('#simtp').innerHTML = '<div class="trow hdr"><span>TP</span><span>BIB</span><span>State</span><span></span><span></span><span></span></div>'
    + `<div class="trow" style="border-left-color:var(--warn)"><span style="color:var(--dim)">↔</span>
        <span${two.length === 2 ? '' : ' style="color:var(--dim)"'}>${two.length === 2 ? two.join(' ↔ ') : '—'}</span>
        <span class="st" style="color:var(--dim)">mix-up in the pits · select two riders</span>
        <button class="btn xs quiet" data-sim="swapbikes"${two.length === 2 ? '' : ' disabled'} title="Each of the two bikes leaves with the other's transponder. Nothing says so: the loops simply announce each rider in the other's place.">Swap</button><span></span><span></span></div>`
    + S.tp.map(t => {
      const worn = t.bib || t.forBib;

        : t.silent ? '<span class="st" style="color:var(--crit)">silent</span>'

      return `<div class="trow${t.bib ? '' : ' spare'}">
        <span${t.silent ? ' class="dead"' : ''}>${t.id}</span>
        <span${worn ? '' : ' style="color:var(--dim)"'}>${worn || '—'}</span>${st}
        <button class="btn xs quiet${t.silent ? ' on' : ''}" data-sim="silent" data-bib="${t.bib || 0}"${t.bib ? '' : ' disabled'}>Silent</button>
        <button class="btn xs quiet" data-sim="bike" data-bib="${t.bib || 0}"${t.bib ? '' : ' disabled'}>Bike</button>
        ${t.bib ? `<button class="btn xs quiet" data-sim="free-tp" data-tp="${t.id}">Free</button>`
                : `<button class="btn xs quiet" data-sim="assign" data-tp="${t.id}" data-bib="${t.forBib || 0}"${(t.forBib || S.noTp.size) ? '' : ' disabled'}>Assign</button>`}</div>`;
    }).join('')
    + [...S.noTp.keys()].filter(b => !S.tp.some(t => t.bib === b || t.forBib === b)).map(b => `<div class="trow" style="border-left-color:var(--dim)">
        <span style="color:var(--dim)">—</span><span>${b}</span><span class="st" style="color:var(--dim)">no transponder · ${nameOf(b)}</span>
        <button class="btn xs quiet" disabled>Silent</button>
        <button class="btn xs quiet" data-sim="bike" data-bib="${b}">Bike</button>
        <button class="btn xs quiet" disabled>Assign</button></div>`).join('');

  const mRow = (label, key, val) => `<div class="krow"><span>${label}</span>
    <span class="spd"><button class="stp" data-cfg="${key}" data-d="-1"${lock}>−</button><input class="v" data-k="${key}" value="${val}"${lock}><button class="stp" data-cfg="${key}" data-d="1"${lock}>+</button><span class="u">m</span></span>
    <span></span></div>`;
  const fixed = (label, val, right) => `<div class="krow"><span>${label}</span>
    <span class="spd"><span class="v">${val}</span><span class="u">m</span></span>
    <span class="u" style="text-align:right">${right || ''}</span></div>`;
  $('#simtrack').innerHTML = `<div class="ksub">Lap length</div>
    <div class="krow" style="grid-template-columns:minmax(0,1fr) auto 26px"><span>Track</span>

      <span class="u" style="text-align:right">m</span></div>
    <div class="ksub">Loops<span class="sp"></span><span style="color:var(--dim);text-transform:none;letter-spacing:0">pursuits face to face, half a lap apart</span></div>
    ${fixed('Finish', 0)}
    ${mRow('Finish → Pursuit A', 'gap', CFG.gap)}
    ${fixed('Pursuit A', CFG.a)}${fixed('Pursuit B', CFG.b)}
    <div class="ksub">Tape switches<span class="sp"></span><span style="color:var(--dim);text-transform:none;letter-spacing:0">${TAPES.length} installed · contacts</span></div>

  // the same button does it. No dialog: the rail is the operator's own screen and a modal would cover it.
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const row = (r, i) => renaming === i
    ? `<div class="crow">

  $('#simfileslist').innerHTML = (REC && S.t > 0 && !RACES.some(x => x.id === REC.id) ? `<div class="crow rec"><div class="nm"><span class="dot"></span>${raceName(REC)}</div>
      <div class="mt"><span class="du">recording · lap ${dispLap()}</span></div></div>` : '')
    + (RACES.length ? RACES.map((r, i) => row(r, i)).join('') : '<div class="hint">No saved race. Play one and press New.</div>');
  if (renaming != null) { const el = $('#rnin'); if (el && document.activeElement !== el) { el.focus(); el.select(); } }

  $('#simstartlist').innerHTML = `<div class="ksub">Entered riders<span class="sp"></span><button class="btn xs quiet" id="rosteradd"${lock}>Add</button><button class="btn xs quiet${startListEditing ? ' on' : ''}" id="rosteredit"${lock}>Edit</button></div>`
    + sortedRoster().map(({ e: [bib, name, nat, color], i }) => `<div class="rosterrow${startListEditing ? ' editing' : ''}">

}

function tickRail() {
  $('#simclock').textContent = fmtT(S.t);   // the clock runs whether the simulator is shown or hidden away in the bar
  if ($('#rail').hidden) return;
  for (let i = 0; i < TAPES.length; i++) { const el = $('#tapec' + i); if (el) el.textContent = S.taps[i].length; }
  for (const r of S.riders) {
    const row = railRows[r.bib]; if (!row) continue;
    const po = S.pilot[r.bib];
    row.el.classList.toggle('piloted', !!po);
    row.el.classList.toggle('gone', r.mode === 'out' || S.withdrawn.has(r.bib));
    if (document.activeElement !== row.v) row.v.value = r.spd.toFixed(1);
    const mission = po && po.kind !== 'spd' && po.kind !== 'follow' ? po.kind : null;
    for (const k of ['up', 'down', 'gain', 'lose']) {
      const b = row.b[k], lit = mission === k;
      b.classList.toggle('on', lit);
      // The lit button fills from left to right with the ground its mission has left to cover, so the operator sees
      // where it is without reading a number — the operator, 28 October 2026, option A of the mockup.
      b.style.setProperty('--prog', lit ? Math.round((po.prog || 0) * 100) + '%' : '0%');
    }
    // An arrow with nowhere to go does not light: the leading group has nothing ahead of it, the last group nothing
    // behind. Clicking it did nothing at all and said nothing — the operator, 28 October 2026: « ok ». An arrow that
    // is not the mission under way is out too, for as long as that mission runs.
    for (const [k, dir] of [['up', -1], ['down', 1]]) {
      const n = neighbourGroup(r.bib, dir);
      row.b[k].disabled = mission ? mission !== k : (!n || !n.length);
    }
  }
}

// nothing and opens nothing — the operator, 28 October 2026: « le bouton Restart doit redémarrer la course ».
$('#simrestart').addEventListener('click', () => {
  if (!S.started && !curActs().length) return;   // nothing loaded and nothing run: there is no race to restart
  // Replaying a race the operator ran himself turns it into a replay of that race: it is already in the list, kept
  // up to date there, so there is nothing left to record.
  const src = LOADED || (REC ? RACES.find(x => x.id === REC.id) : null);
  const acts = (src ? src.acts : curActs()).map(a => ({ ...a }));
  saveRec(); reset();
  LOADED = src || { name: 'this race', acts }; REC = null;
  S.replay = acts.map(a => ({ ...a })).sort((a, b) => a.t - b.t);
  logEvent('RACE', 'Replay · ' + LOADED.name, false);
  syncSeg(); railDirty = true; dirty = true; render();
});
// … and a race of its own: the current one is saved, an empty one opens on the configuration shown. This is what
// Restart did until the build 74 — « Il faut ajouter un bouton pour faire une nouvelle course » (same day).
$('#simnew').addEventListener('click', () => {
  saveRec(); reset(); LOADED = null; REC = newRec();
  syncSeg(); railDirty = true; dirty = true; render();
});
function rewind30() {
  if (!S.started) return;
  const target = Math.max(0, S.t - 30);
  const keep = curActs().filter(a => a.t <= target);
  reset();
  S.started = true;
  if (REC) REC.acts = keep;
  S.replay = keep.map(a => ({ ...a })).sort((a, b) => a.t - b.t);
  let guard = 0;
  while (S.t < target && !S.finished && guard++ < 400000) { replayTick(); step(FIXED); detectNow(); }
  S.factor = lastFactor > 0 ? lastFactor : 1;
  saveRec();
  logEvent('RACE', 'Rewound 30 s · back to ' + fmtT(S.t), false);
  syncSeg(); railDirty = true; dirty = true; render();
}
$('#simrewind').addEventListener('click', rewind30);
// Every rider back in the bunch at the bunch's pace, piloted or not.
// The button says what it does and does what it says: EVERY RIDER RIDES THE BUNCH'S SPEED. The operator, 28 October
// 2026: « son libellé ne dis pas qu'il va les remettre dans le peloton, il dit que tous les coureurs doivent rouler
// à la vitesse du peloton. c'est ça que je veux ». So nobody is moved and nobody changes place on the track: each
// rider's slot becomes where he already is, and from there he rides the pace. An order in progress stops, because an
// order is precisely a rider NOT riding the bunch's speed.
function syncAllToBunchPace() {
  const live = S.riders.filter(r => r.mode !== 'out' && r.mode !== 'off').map(r => r.bib);
  if (live.length) doAct('free', live);
  for (const r of S.riders) {
    if (r.mode !== 'bunch') continue;
    r.offset = round1(r.dist - S.anchor - TRACK * r.lapTrue);
    r.spd = CFG.pace;
  }
  railDirty = true; dirty = true; render();
}
function applyRosterEdit(i, field, value) {
  if (S.started || !RIDERS[i]) return;
  if (field === 'bib') {
    let v = Math.round(+value);
    if (isFinite(v) && v > 0 && !RIDERS.some((x, j) => j !== i && x[0] === v)) RIDERS[i][0] = v;
  } else if (field === 'name') {
    const v = String(value || '').trim().toUpperCase(); if (v) RIDERS[i][1] = v;
  } else if (field === 'nat') {
    const v = String(value || '').trim().toUpperCase().slice(0, 3); if (v) RIDERS[i][2] = v;
  } else if (field === 'color') {
    RIDERS[i][3] = value;
  }
  reset(); REC = newRec(); saveSetup(); railDirty = true; dirty = true; render();
}
function addRosterRider() {
  if (S.started) return;
  const used = new Set(RIDERS.map(x => x[0])); let bib = 1; while (used.has(bib)) bib++;
  const palette = ['#0284c7', '#c8102e', '#f97316', '#eab308', '#9f1239', '#1d4ed8', '#16a34a', '#d62828', '#4b5563', '#06b6d4', '#22c55e', '#111827', '#ef4444', '#ec4899', '#1e3a8a', '#15803d'];
  RIDERS.push([bib, 'NEW RIDER', '—', palette[RIDERS.length % palette.length]]);
  reset(); REC = newRec(); saveSetup(); railDirty = true; dirty = true; render();
}
function removeRosterRider(i) {
  if (S.started || RIDERS.length <= 2 || !RIDERS[i]) return;
  RIDERS.splice(i, 1);
  reset(); REC = newRec(); saveSetup(); railDirty = true; dirty = true; render();
}
function commitRailInput(el) {
  const v = parseFloat(String(el.value).replace(',', '.'));
  if (el.id === 'cfglaps') {
    if (!S.started && isFinite(v)) { CFG.laps = Math.max(2, Math.min(400, Math.round(v))); CFG.sprints = Math.min(CFG.sprints, CFG.laps); applyCfg(); REC = newRec(); saveSetup(); railDirty = true; dirty = true; }
    render();
  } else if (el.id === 'cfgsprints') {
    if (!S.started && isFinite(v)) { CFG.sprints = Math.max(1, Math.min(CFG.laps, Math.round(v))); applyCfg(); REC = newRec(); saveSetup(); railDirty = true; dirty = true; }
    render();
  } else if (el.id === 'cfgpace') {
    setPace(v);
    render();
  } else if (el.dataset.k === 'gap') {
    if (!S.started && isFinite(v)) { CFG.gap = Math.max(0, Math.min(Math.round(TRACK / 4), Math.round(v))); applyCfg(); REC = newRec(); saveSetup(); railDirty = true; dirty = true; }
    render();
  } else if (el.closest('.rosterrow')) {
    applyRosterEdit(+el.dataset.ri, el.dataset.f, el.value);
  } else {
    const row = el.closest('.rrow[data-bib]');
    if (row) {
      const bib = +row.dataset.bib;
      if (isFinite(v)) doAct('spd', [bib], +Math.max(5, Math.min(25, v)).toFixed(1));
      else if (!String(el.value).trim()) doAct('free', [bib]);   // emptied: he rides with the bunch again
    }
    render();
  }
}
$('#rail').addEventListener('focusout', e => { if (e.target.matches('input.v, .rosterrow input') && !e.target.dataset.done) commitRailInput(e.target); });
$('#rail').addEventListener('keydown', e => {
  if (!e.target.matches('input.v, .rosterrow input')) return;
  if (e.key === 'Enter') { e.preventDefault(); const el = e.target; el.dataset.done = '1'; commitRailInput(el); el.blur(); delete el.dataset.done; }   // Enter commits by itself: it does not wait for the focus to go somewhere else
  else if (e.key === 'Escape') { e.target.blur(); }
});
$('#rail').addEventListener('click', e => {
  const b = e.target.closest('[data-sim],[data-cfg],[data-col],[data-sort],[data-track],[data-load],[data-del],[data-rn],[data-rnok],[data-rncancel],[data-rosterdel],#syncspeeds,#rosteradd,#rosteredit');
  if (!b || b.disabled) return;
  // Un clic sur un en-tête trie sur cette colonne ; un second clic sur le même en-tête inverse l'ordre.
  if (b.dataset.sort) {
    simSort = simSort && simSort.key === b.dataset.sort ? { key: b.dataset.sort, dir: -simSort.dir } : { key: b.dataset.sort, dir: 1 };
    railDirty = true; render(); return;
  }
  if (b.dataset.track) return setTrack(+b.dataset.track);
  if (b.dataset.cfg) return cfgStep(b.dataset.cfg, +b.dataset.d);
  if (b.dataset.load != null) { const r = RACES[+b.dataset.load]; if (r) loadRace(r); return; }
  if (b.dataset.del != null) {
    const i = +b.dataset.del;
    if (delArmed !== i) { delArmed = i; renaming = null; railDirty = true; render(); return; }   // first click: ask
    const gone = RACES[i];
    RACES.splice(i, 1); saveRaces(); delArmed = null;
    logEvent('OP', 'Race deleted · ' + gone.name, false);
    railDirty = true; render(); return;
  }
  if (b.dataset.rn != null) { renaming = +b.dataset.rn; delArmed = null; railDirty = true; render(); return; }
  if (b.dataset.rncancel != null) { renaming = null; railDirty = true; render(); return; }
  if (b.dataset.rnok != null) { commitRename(+b.dataset.rnok); return; }
  if (b.id === 'syncspeeds') return syncAllToBunchPace();
  if (b.dataset.col && b.dataset.col !== 'bib') { simCols[b.dataset.col] = !simCols[b.dataset.col]; railDirty = true; render(); return; }
  if (b.id === 'rosteradd') return addRosterRider();
  if (b.id === 'rosteredit') { startListEditing = !startListEditing; railDirty = true; render(); return; }
  if (b.dataset.rosterdel != null) return removeRosterRider(+b.dataset.rosterdel);
  const kind = b.dataset.sim, bib = +b.dataset.bib || 0, r = S.riders.find(x => x.bib === bib);
  if (kind === 'spd') { const po = S.pilot[bib]; const v = +(((po && po.kind === 'spd' ? po.v : r.spd) + 0.1 * +b.dataset.d).toFixed(1)); doAct('spd', [bib], v); }
  else if (kind === 'free') { if (S.pilot[bib]) doAct('free', [bib]); }
  else if (kind === 'swapbikes') { const two = [...S.selection].sort(byBib); if (two.length === 2) doAct('swapbikes', two); }
  else if (kind === 'assign' || kind === 'free-tp') doAct(kind, [bib], +b.dataset.tp);
  else if (kind) { if (S.pilot[bib] && S.pilot[bib].kind === kind) doAct('free', [bib]); else doAct(kind, [bib]); }
  render();
});
$('#rail').addEventListener('change', e => { if (e.target.matches('.rosterrow input[type=color]')) applyRosterEdit(+e.target.dataset.ri, 'color', e.target.value); });
$('#simopen').addEventListener('click', () => $('#simfile').click());
$('#simfile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const r = JSON.parse(fr.result);
      if (!r || !r.cfg || !Array.isArray(r.acts)) throw new Error('not a race file');
      r.name = r.name || raceName(r); RACES.unshift(r); saveRaces(); railDirty = true; render();
    } catch (err) { logEvent('READ', 'Race file not read: ' + err.message, false); railDirty = true; render(); }
  };
  fr.readAsText(f); e.target.value = '';
});
// A renamed race keeps its new name through a reload, because the whole list is written back to localStorage.
// An empty name is refused in silence: the row keeps the one it had rather than becoming nameless.
function commitRename(i) {
  const el = $('#rnin'), v = el ? el.value.trim() : '';
  if (v && RACES[i] && v !== RACES[i].name) { logEvent('OP', 'Race renamed · ' + RACES[i].name + ' → ' + v, false); RACES[i].name = v; RACES[i].named = true; saveRaces(); }
  renaming = null; railDirty = true; render();
}
document.addEventListener('keydown', e => {
  if (renaming == null || e.target.id !== 'rnin') return;
  if (e.key === 'Enter') { e.preventDefault(); commitRename(renaming); }
  if (e.key === 'Escape') { e.preventDefault(); renaming = null; railDirty = true; render(); }
});
function saveRaceFile(r) { download('race-' + r.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase().replace(/^-|-$/g, '').slice(0, 60) + '.json', JSON.stringify(r, null, 1), 'application/json'); }
function loadRace(r) {
  saveRec();
  // a race saved before the geometry was derived carries a and b instead of the gap: read the gap back out of a
  const c = { ...DEF, ...r.cfg };
  if (r.cfg && r.cfg.gap == null && r.cfg.a != null) c.gap = Math.max(0, Math.round(c.track - r.cfg.a));
  delete c.tape; CFG = c; applyCfg();
  reset();
  S.replay = (r.acts || []).map(a => ({ ...a })).sort((a, b) => a.t - b.t);
  LOADED = r; REC = null;
  S.hideOnStart = true;   // the rail stays until the operator starts the race, then steps out of the way
  railHide(false); syncSeg(); railDirty = true; dirty = true; render();
}

// ---------- loop ----------
window.__proto = { state: () => S, step, replayTick, measured, computeGroups, render, detect, tapeCount, sp, spOrder, spFull, spSend, spInsert, spHold, standings, dispLap, noTpToggle, markDirty: () => { dirty = true; } };
loadSetup(); applyCfg(); reset(); REC = newRec(); railDirty = true; render();
syncSeg();   // the bar is drawn: its labels can be measured and centred on their ink
let last = performance.now();
// the race advances in fixed steps of FIXED seconds whatever the speed, so 1x, 4x and 16x run the same race;
// lap detection looks at every step (at 16x a frame is 0.8 s of race time, longer than the 0.3 s touch window)
const FIXED = 0.05;
let carry = 0;
function advance(dt) {
  if (!S.started || S.factor <= 0 || S.finished) { carry = 0; return; }
  carry += dt * S.factor;
  while (carry >= FIXED && !S.finished) { replayTick(); step(FIXED); detectNow(); carry -= FIXED; }
}
function detectNow() { const M = measured(); detect(computeGroups(M), M); lastDetect = S.t; }
function frame() {
  const now = performance.now(), dt = Math.min(0.25, (now - last) / 1000); last = now;
  try { advance(dt); render(); } catch (e) { console.error(e); }
}
setInterval(frame, 50);   // a timer, not requestAnimationFrame: it keeps running when the page is in the background
})();
</script>
